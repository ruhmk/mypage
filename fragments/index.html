<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07090f" />
    <title>Today Fragments</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="styles.css?v=44" />
  </head>
  <body>
    <noscript>Today Fragmentsを使うにはJavaScriptを有効にしてください。</noscript>
    <main id="app" class="app-shell">
      <section id="setup" class="setup-screen" aria-live="polite"></section>
      <section id="capture" class="capture-screen hidden"></section>
      <section id="workspace" class="workspace hidden" aria-live="polite">
        <div class="particle-layer" aria-hidden="true"></div>
        <div id="world" class="world">
          <div id="group-layer" class="layer group-layer"></div>
          <svg id="line-layer" class="layer line-layer" aria-label="接続線"></svg>
          <div id="card-layer" class="layer card-layer"></div>
        </div>

        <header class="topbar">
          <button id="project-switcher" class="brand project-switcher" type="button" aria-label="案件一覧を開く">
            <span class="brand-mark"></span>
            <span class="brand-text">
              <strong id="project-title">Today Fragments</strong>
              <span id="role-label">未設定</span>
            </span>
          </button>
          <div class="status-group">
            <button id="receive-button" class="status-button" type="button">受信</button>
            <button id="backup-button" class="status-button" type="button">保存</button>
          </div>
          <nav class="toolbar" aria-label="ツール">
            <button id="undo-action" class="tool-button" title="直前の操作を取り消す（Ctrl+Z）" disabled>戻す</button>
            <button id="redo-action" class="tool-button" title="取り消した操作をやり直す（Ctrl+Y）" disabled>やり直す</button>
            <button id="reset-view" class="tool-button" title="カード全体が画面の中央に来るように視点を戻す（Ctrl+0）">中央へ</button>
            <button id="movement-lock" class="tool-button" title="すべてのカードとグループを動かせなくする">全体ロック</button>
            <button id="add-group" class="tool-button" title="新しいグループを画面の中央に作る">グループ追加</button>
            <button id="export-ai" class="tool-button" title="メモをAIに渡せる文章にしてコピーする">AI書き出し</button>
            <button id="pc-qr" class="tool-button" title="案件とグループの一覧をQRにしてスマホへ渡す">QRをスマホへ</button>
            <button id="trash-open" class="tool-button" title="ゴミ箱に入れたカードを見る・戻す">ゴミ箱</button>
            <button id="settings-open" class="tool-button" title="受け取り先・バックアップ・引っ越しの設定">設定</button>
          </nav>
        </header>

        <form id="composer" class="composer" autocomplete="off">
          <textarea id="quick-note" rows="2" placeholder="今日あったこと（Ctrl+Enterで追加）"></textarea>
          <button class="send-button" title="追加" aria-label="追加" type="submit">＋</button>
        </form>

        <aside id="inspector" class="inspector" aria-live="polite"></aside>
        <button id="panel-toggle" class="panel-toggle" type="button" title="入力と詳細を開閉" aria-label="入力と詳細を開閉">▤</button>
      </section>
    </main>

    <div id="modal-root" class="modal-root" aria-live="polite"></div>
    <script src="app.js?v=44" defer></script>
  </body>
</html>
