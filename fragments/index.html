<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07090f" />
    <title>Today Fragments</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="styles.css?v=33" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="vendor/qrcode-generator.js?v=33" defer></script>
    <script src="vendor/jsQR.js?v=33" defer></script>
  </head>
  <body>
    <noscript>Today Fragmentsを使うにはJavaScriptを有効にしてください。</noscript>
    <main id="app" class="app-shell">
      <section id="setup" class="setup-screen" aria-live="polite"></section>
      <section id="workspace" class="workspace hidden" aria-live="polite">
        <canvas id="gl-canvas" class="gl-canvas" aria-hidden="true"></canvas>
        <div class="particle-layer" aria-hidden="true"></div>
        <div id="world" class="world">
          <div id="group-layer" class="layer group-layer"></div>
          <svg id="line-layer" class="layer line-layer" aria-label="接続線"></svg>
          <div id="card-layer" class="layer card-layer"></div>
        </div>

        <header class="topbar">
          <button id="project-switcher" class="brand project-switcher" type="button" aria-label="案件一覧を開く">
            <span class="brand-mark"></span>
            <span class="brand-text">
              <strong id="project-title">Today Fragments</strong>
              <span id="role-label">未設定</span>
            </span>
          </button>
          <div id="sync-status" class="sync-status">ローカル保存</div>
          <nav class="toolbar" aria-label="ツール">
            <button id="undo-action" class="icon-button" title="戻る" aria-label="戻る" disabled>
              <span>↶</span>
            </button>
            <button id="redo-action" class="icon-button" title="進む" aria-label="進む" disabled>
              <span>↷</span>
            </button>
            <button id="reset-view" class="icon-button" title="視点リセット" aria-label="視点リセット">
              <span>⌖</span>
            </button>
            <button id="movement-lock" class="icon-button" title="全体の位置ロック" aria-label="全体の位置ロック">
              <span>止</span>
            </button>
            <button id="add-group" class="icon-button" title="グループ追加" aria-label="グループ追加">
              <span>□</span>
            </button>
            <button id="list-mode-toggle" class="icon-button hidden-pc" title="一覧表示" aria-label="一覧表示">
              <span>☰</span>
            </button>
            <button id="export-ai" class="icon-button" title="AI用に書き出し" aria-label="AI用に書き出し">
              <span>⇩</span>
            </button>
            <button id="github-sync" class="icon-button hidden-pc" title="GitHub同期" aria-label="GitHub同期">
              <span>⇧</span>
            </button>
            <button id="pc-qr" class="icon-button hidden-phone" title="QRでスマホへ" aria-label="QRでスマホへ">
              <span>▦</span>
            </button>
            <button id="phone-import" class="icon-button hidden-pc" title="PCから取り込み" aria-label="PCから取り込み">
              <span>▣</span>
            </button>
            <button id="trash-open" class="icon-button" title="ゴミ箱" aria-label="ゴミ箱">
              <span>⌫</span>
            </button>
            <button id="settings-open" class="icon-button" title="設定" aria-label="設定">
              <span>⚙</span>
            </button>
          </nav>
        </header>

        <form id="composer" class="composer" autocomplete="off">
          <textarea id="quick-note" rows="2" placeholder="今日あったこと"></textarea>
          <button class="send-button" title="追加" aria-label="追加" type="submit">＋</button>
        </form>

        <aside id="inspector" class="inspector" aria-live="polite"></aside>
        <aside id="mobile-list" class="mobile-list" aria-live="polite"></aside>
        <button id="panel-toggle" class="panel-toggle" type="button" title="入力と詳細を開閉" aria-label="入力と詳細を開閉">▤</button>
      </section>
    </main>

    <div id="modal-root" class="modal-root" aria-live="polite"></div>
    <script src="app.js?v=33" defer></script>
  </body>
</html>
