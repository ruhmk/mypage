<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>家族カレンダー</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Family Calendar</p>
          <h1>家族カレンダー</h1>
        </div>
        <div class="top-actions" aria-label="表示操作">
          <button class="secondary-button" id="refreshGoogleButton" type="button">Google予定を更新</button>
          <button class="icon-button" id="prevMonth" type="button" aria-label="前の月" title="前の月">
            <span aria-hidden="true">&lt;</span>
          </button>
          <button class="text-button" id="todayButton" type="button">今日</button>
          <button class="icon-button" id="nextMonth" type="button" aria-label="次の月" title="次の月">
            <span aria-hidden="true">&gt;</span>
          </button>
        </div>
      </header>

      <main class="calendar-layout">
        <section class="calendar-main" aria-label="月間カレンダー">
          <div class="month-strip">
            <div>
              <p class="month-kicker" id="yearLabel"></p>
              <h2 id="monthLabel"></h2>
            </div>
            <div class="source-toggles" aria-label="表示する予定">
              <label class="source-toggle">
                <input type="checkbox" value="personal" checked>
                <span class="source-dot personal"></span>
                <span>個人</span>
              </label>
              <label class="source-toggle">
                <input type="checkbox" value="work" checked>
                <span class="source-dot work"></span>
                <span>仕事</span>
              </label>
            </div>
            <p class="import-status" id="importStatus" role="status"></p>
          </div>

          <div class="weekday-row" aria-hidden="true">
            <span>日</span>
            <span>月</span>
            <span>火</span>
            <span>水</span>
            <span>木</span>
            <span>金</span>
            <span>土</span>
          </div>
          <div class="calendar-grid" id="calendarGrid"></div>
        </section>

        <aside class="side-panel" aria-label="予定">
          <section class="day-panel">
            <div class="panel-heading">
              <div>
                <p class="panel-kicker">Selected</p>
                <h2 id="selectedDateLabel"></h2>
              </div>
              <button class="primary-button" id="openComposer" type="button">予定追加</button>
            </div>
            <div class="event-list" id="selectedEventList"></div>
          </section>

          <section class="upcoming-panel">
            <div class="panel-heading compact">
              <div>
                <p class="panel-kicker">Next</p>
                <h2>これから</h2>
              </div>
            </div>
            <div class="event-list" id="upcomingEventList"></div>
          </section>
        </aside>
      </main>
    </div>

    <dialog class="event-dialog" id="eventDialog">
      <form method="dialog" class="event-form" id="eventForm">
        <div class="dialog-heading">
          <div>
            <p class="panel-kicker">Schedule</p>
            <h2>予定追加</h2>
          </div>
          <button class="icon-button" id="closeComposer" type="button" aria-label="閉じる" title="閉じる">
            <span aria-hidden="true">x</span>
          </button>
        </div>

        <label>
          <span>タイトル</span>
          <input id="eventTitle" name="title" type="text" autocomplete="off" required>
        </label>

        <div class="field-grid">
          <label>
            <span>日付</span>
            <input id="eventDate" name="date" type="date" required>
          </label>
          <label>
            <span>種別</span>
            <select id="eventSource" name="source">
              <option value="family">家族</option>
              <option value="personal">個人</option>
              <option value="work">仕事</option>
            </select>
          </label>
        </div>

        <div class="field-grid">
          <label>
            <span>開始</span>
            <input id="eventStart" name="start" type="time" required>
          </label>
          <label>
            <span>終了</span>
            <input id="eventEnd" name="end" type="time" required>
          </label>
        </div>

        <label>
          <span>メモ</span>
          <textarea id="eventNote" name="note" rows="3"></textarea>
        </label>

        <div class="dialog-actions">
          <button class="secondary-button" id="googleDraftButton" type="button">Googleで作成</button>
          <button class="primary-button" id="saveLocalButton" value="default" type="submit">保存</button>
        </div>
      </form>
    </dialog>

    <script src="./data/config.js?v=20260527-3"></script>
    <script src="./data/events.js?v=20260527-3"></script>
    <script src="./app.js?v=20260527-3" defer></script>
  </body>
</html>
