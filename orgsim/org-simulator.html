    function bindInspectorField(id, eventName, toPatch) {
      const el = document.getElementById(id);
      if (eventName === "input") {
        let beforeEdit = null;
        let committed = false;
        const commitEdit = () => {
          if (!beforeEdit || committed) return;
          const changed = beforeEdit !== snapshot();
          if (changed) pushHistorySnapshot(beforeEdit);
          beforeEdit = null;
          committed = true;
          if (changed) renderStats();
        };
        el.addEventListener("focus", () => {
          beforeEdit = snapshot();
          committed = false;
        });
        el.addEventListener("input", (event) => {
          if (!beforeEdit) beforeEdit = snapshot();
          committed = false;
          patchNodeLive(selectedNodeId, toPatch(event.target.value));
        });
        el.addEventListener("change", commitEdit);
        el.addEventListener("blur", commitEdit);
        return;
      }
      el.addEventListener(eventName, (event) => {
        updateNode(selectedNodeId, toPatch(event.target.value), { quiet: true });
      });
    }

    function patchNodeLive(id, patch) {
      const scenario = getActiveScenario();
      const nodeIndex = scenario.nodes.findIndex((node) => node.id === id);
      if (nodeIndex < 0) return;
      scenario.nodes[nodeIndex] = { ...scenario.nodes[nodeIndex], ...patch };
      refreshSelectedNodePreview(scenario.nodes[nodeIndex]);
      saveState();
    }

    function refreshSelectedNodePreview(node) {
      const nodeEl = nodeElements.get(node.id);
      if (nodeEl) {
        const roleEl = nodeEl.querySelector(".role");
        const personEl = nodeEl.querySelector(".person");
        const metaEl = nodeEl.querySelector(".meta");
        const avatarEl = nodeEl.querySelector(".node-avatar");
        if (roleEl) roleEl.textContent = node.role || "役割未設定";
        if (personEl) personEl.textContent = nodeDisplayName(node);
        if (metaEl) metaEl.innerHTML = nodeMetaHtml(node);
        if (avatarEl) {
          avatarEl.outerHTML = nodeAvatarHtml(node);
        } else {
          nodeEl.insertAdjacentHTML("afterbegin", nodeAvatarHtml(node));
        }
        nodeEl.classList.add("has-avatar");
        nodeEl.title = `${node.role || ""} / ${nodeDisplayName(node)}`;
      }
      panelTitleEl.textContent = nodeDisplayName(node);
      panelSubtitleEl.textContent = `${node.role || "役割未設定"} / ${node.team || "所属未設定"}`;
    }

    function focusPersonEditor() {
      requestAnimationFrame(() => {
        const input = document.getElementById("personName");
        if (!input) return;
        input.focus();
        input.select();
      });
    }

    function focusRequirementEditor() {
      requestAnimationFrame(() => {
        const input = document.getElementById("requirementName");
        if (!input) return;
        input.focus();
        input.select();
      });
    }

    function renderInsights() {
      const nodes = getCurrentNodes();
      const childCounts = new Map(nodes.map((node) => [node.id, 0]));
      nodes.forEach((node) => {
        if (node.parent && childCounts.has(node.parent) && node.status !== "removed") {
          childCounts.set(node.parent, childCounts.get(node.parent) + 1);
        }
      });

      const insights = [];
      nodes.forEach((node) => {
        if (node.status === "removed" && childCounts.get(node.id) > 0) {
          insights.push([`${node.name}の配下`, "人員減のまま配下が残っています。接続先の再設定候補です。"]);
        }
        if (childCounts.get(node.id) >= 4 && node.status !== "removed") {
          insights.push([`${node.name}の配下数`, "配下が多めです。中間リードの追加候補です。"]);
        }
        if ((node.name || "").includes("未定") && node.status !== "removed") {
          insights.push([node.role || "未定枠", "担当未定です。追加候補か外注候補として比較できます。"]);
        }
        if (node.hiring && !node.requirement && node.status !== "removed") {
          insights.push([node.role || "採用枠", "人員要件が未入力です。必要スキル、稼働時期、期待役割を整理できます。"]);
        }
      });

      if (!insights.length) {
        insights.push(["大きな注意点なし", "変更差分と空き枠を見ながら案を比較できます。"]);
      }

      return insights
        .slice(0, 7)
        .map(([title, body]) => `<li class="insight"><b>${escapeHtml(title)}</b><span>${escapeHtml(body)}</span></li>`)
        .join("");
    }

    function option(value, label, selected) {
      return `<option value="${value}" ${value === selected ? "selected" : ""}>${label}</option>`;
    }

    function buildKnotParentOptions(knot) {
      const nodeOptions = getCurrentNodes()
        .filter((node) => !isDescendant(node.id, knot.id))
        .map((node) => `<option value="${node.id}" ${knot.parent === node.id ? "selected" : ""}>${escapeHtml(node.role)} / ${escapeHtml(nodeDisplayName(node))}</option>`);
      const knotOptions = getCurrentKnots()
        .filter((candidate) => candidate.id !== knot.id && !isDescendant(candidate.id, knot.id))
        .map((candidate) => `<option value="${candidate.id}" ${knot.parent === candidate.id ? "selected" : ""}>${escapeHtml(knotDisplayName(candidate))} / 線ノット</option>`);
      return [`<option value="">なし</option>`].concat(nodeOptions, knotOptions).join("");
    }

    function updateNode(id, patch, options = {}) {
      const scenario = getActiveScenario();
      const nodeIndex = scenario.nodes.findIndex((node) => node.id === id);
      if (nodeIndex < 0) return;
      if (!options.noHistory) pushHistory();
      scenario.nodes[nodeIndex] = { ...scenario.nodes[nodeIndex], ...patch };
      if (!options.quiet) notify("カードを更新しました");
      render();
    }

    function updateKnot(id, patch) {
      const scenario = getActiveScenario();
      const knotIndex = (scenario.knots || []).findIndex((knot) => knot.id === id);
      if (knotIndex < 0) return;
      if (patch.parent && isDescendant(patch.parent, id)) {
        notify("循環する接続は設定できません");
        render();
        return;
      }
      pushHistory();
      scenario.knots[knotIndex] = { ...scenario.knots[knotIndex], ...patch };
      notify("線ノットを更新しました");
      render();
    }

    function toggleKnotLock(id) {
      const scenario = getActiveScenario();
      const knot = (scenario.knots || []).find((item) => item.id === id);
      if (!knot) return;
      pushHistory();
      if (knot.locked) {
        knot.locked = false;
        knot.lockedLinks = [];
        notify("線ノットのロックを解除しました");
      } else {
        knot.locked = true;
        knot.lockedLinks = getLinkIdsThroughKnot(knot);
        notify(`${knot.lockedLinks.length}本の線をロックしました`);
      }
      render();
    }

    function getLinkIdsThroughKnot(knot) {
      if (!currentLayout) return [];
      return currentLayout.nodes
        .filter((node) => node.parent && getParentAnchor(currentLayout, node.parent) && currentLayout.positions.has(node.id))
        .filter((node) => {
          const parentAnchor = getParentAnchor(currentLayout, node.parent);
          const child = currentLayout.positions.get(node.id);
          const parentCenter = anchorCenter(parentAnchor);
          const childCenter = { x: child.x + child.width / 2, y: child.y + child.height / 2 };
          const start = anchorEdgePoint(parentAnchor, childCenter);
          const end = edgePoint(child, parentCenter);
          return distanceToSegment(knot, start, end) < KNOT_CAPTURE_DISTANCE;
        })
        .map(linkIdFor);
    }

    function addNode() {
      pushHistory();
      const scenario = getActiveScenario();
      const id = `node-${Date.now().toString(36)}`;
      const parent = selectedNodeId && getNode(selectedNodeId) ? selectedNodeId : null;
      const parentNode = getNode(parent);
      const parentPos = currentLayout?.positions.get(parent);
      const boardCenter = {
        x: (boardScrollEl.scrollLeft + boardScrollEl.clientWidth / 2) / viewport.scale,
        y: (boardScrollEl.scrollTop + boardScrollEl.clientHeight / 2) / viewport.scale
      };
      scenario.nodes.push({
        id,
        name: "未定",
        role: "追加枠",
        team: "",
        parent,
        lane: parentNode?.lane || "candidate",
        status: "added",
        decision: "未設定",
        requirement: "",
        hiring: false,
        note: "",
        x: snap(parentPos ? parentPos.x + CARD.width + CARD.gapX : Math.max(0, boardCenter.x - CARD.width / 2)),
        y: snap(parentPos ? parentPos.y + CARD.height + 50 : Math.max(0, boardCenter.y - CARD.height / 2))
      });
      selectedNodeId = id;
      selectedKnotId = null;
      selectedZoneId = null;
      actionPulseNodeId = id;
      notify("追加枠を作成しました");
      render();
      focusPersonEditor();
    }

    function addZone() {
      pushHistory();
      const scenario = getActiveScenario();
      scenario.extraZones ||= [];
      const selectedPos = selectedNodeId ? currentLayout?.positions.get(selectedNodeId) : null;
      const boardPoint = selectedPos
        ? { x: selectedPos.x + CARD.width / 2 + 120, y: selectedPos.y + CARD.height / 2 + 80 }
        : {
            x: (boardScrollEl.scrollLeft + boardScrollEl.clientWidth / 2) / viewport.scale,
            y: (boardScrollEl.scrollTop + boardScrollEl.clientHeight / 2) / viewport.scale
          };
      const width = 420;
      const height = 260;
      const id = `zone-${Date.now().toString(36)}`;
      scenario.extraZones.push({
        id,
        label: "追加枠",
        x: snap(Math.max(0, boardPoint.x - width / 2)),
        y: snap(Math.max(0, boardPoint.y - height / 2)),
        width,
        height,
        locked: false
      });
      selectedNodeId = null;
      selectedKnotId = null;
      selectedZoneId = id;
      notify("枠を追加しました");
      render();
    }

    function toggleZoneLock(id) {
      const zone = getLayoutZone(id);
      if (!zone) return;
      pushHistory();
      zone.locked = !zone.locked;
      saveZoneToScenario(zone);
      notify(zone.locked ? "枠の位置をロックしました" : "枠の位置ロックを解除しました");
      render();
    }

    function updateZone(id, patch, options = {}) {
      const zone = getLayoutZone(id);
      if (!zone) return;
      if (!options.noHistory) pushHistory();
      const next = { ...zone, ...patch };
      next.label = `${next.label || ""}`.trim() || (id === "external" ? "C&R ライン" : "追加枠");
      next.x = Math.max(0, snap(next.x));
      next.y = Math.max(0, snap(next.y));
      next.width = snap(clamp(next.width, 260, 2400));
      next.height = snap(clamp(next.height, 180, 1800));
      next.locked = Boolean(next.locked);
      Object.assign(zone, next);
      saveZoneToScenario(zone);
      if (!options.quiet) notify("枠を更新しました");
      render();
    }

    function patchZoneLive(id, patch) {
      const zone = getLayoutZone(id);
      if (!zone) return;
      const label = `${patch.label ?? zone.label ?? ""}`.trim() || (id === "external" ? "C&R ライン" : "追加枠");
      Object.assign(zone, { ...patch, label });
      saveZoneToScenario(zone);
      const labelEl = boardEl.querySelector(`.zone[data-zone-id="${id}"] .zone-label`);
      if (labelEl) labelEl.textContent = label;
      panelTitleEl.textContent = label;
      saveState();
    }

    function bindZoneTextField(id, toPatch) {
      const el = document.getElementById(id);
      let beforeEdit = null;
      let committed = false;
      const commitEdit = () => {
        if (!beforeEdit || committed) return;
        const changed = beforeEdit !== snapshot();
        if (changed) pushHistorySnapshot(beforeEdit);
        beforeEdit = null;
        committed = true;
      };
      el.addEventListener("focus", () => {
        beforeEdit = snapshot();
        committed = false;
      });
      el.addEventListener("input", (event) => {
        if (!beforeEdit) beforeEdit = snapshot();
        committed = false;
        patchZoneLive(selectedZoneId, toPatch(event.target.value));
      });
      el.addEventListener("change", commitEdit);
      el.addEventListener("blur", commitEdit);
    }

    function addKnot() {
      pushHistory();
      const scenario = getActiveScenario();
      scenario.knots ||= [];
      const selectedPos = selectedNodeId ? currentLayout?.positions.get(selectedNodeId) : null;
      const boardPoint = selectedPos
        ? { x: selectedPos.x + CARD.width + 90, y: selectedPos.y + CARD.height / 2 }
        : {
            x: (boardScrollEl.scrollLeft + boardScrollEl.clientWidth / 2) / viewport.scale,
            y: (boardScrollEl.scrollTop + boardScrollEl.clientHeight / 2) / viewport.scale
          };
      const id = `knot-${Date.now().toString(36)}`;
      const code = nextKnotCode(scenario);
      scenario.knots.push({ id, code, x: snap(boardPoint.x), y: snap(boardPoint.y), locked: false, lockedLinks: [] });
      selectedNodeId = null;
      selectedKnotId = id;
      selectedZoneId = null;
      notify(`線ノット ${code} を追加しました`);
      render();
    }

    function makeVacancy() {
      const node = selectedNodeId ? getNode(selectedNodeId) : null;
      if (!node) return;
      actionPulseNodeId = selectedNodeId;
      updateNode(selectedNodeId, {
        name: "採用枠",
        status: "hiring",
        hiring: true,
        requirement: node.requirement || "",
        note: node.note || "採用・外注の検討が必要"
      });
      notify("採用枠にしました");
      focusRequirementEditor();
    }

    function markRemoved() {
      if (!selectedNodeId || !getNode(selectedNodeId)) return;
      actionPulseNodeId = selectedNodeId;
      updateNode(selectedNodeId, { status: "removed", hiring: false });
      notify("人員減として表示しました");
    }

    function handleKeyDown(event) {
      const target = event.target;
      const tagName = target?.tagName;
      const isEditingField = target?.isContentEditable || tagName === "INPUT" || tagName === "TEXTAREA" || tagName === "SELECT";
      const isModifier = event.ctrlKey || event.metaKey;
      if (isModifier && event.key.toLowerCase() === "z") {
        event.preventDefault();
        if (isEditingField) target.blur();
        event.shiftKey ? redo() : undo();
        return;
      }
      if (isModifier && event.key.toLowerCase() === "y") {
        event.preventDefault();
        if (isEditingField) target.blur();
        redo();
        return;
      }
      if (isEditingField) return;
      if (isModifier && event.key.toLowerCase() === "c") {
        if (copySelectedCard()) event.preventDefault();
        return;
      }
      if (isModifier && event.key.toLowerCase() === "v") {
        if (pasteCopiedCard()) event.preventDefault();
        return;
      }
      if (event.key !== "Delete") return;
      if (!selectedNodeId && !selectedKnotId) return;
      event.preventDefault();
      selectedKnotId ? deleteSelectedKnot() : deleteSelectedNode();
    }

    function copySelectedCard() {
      const node = selectedNodeId ? getNode(selectedNodeId) : null;
      if (!node) return false;
      cardClipboard = {
        node: { ...node },
        sourceScenarioId: activeScenarioId,
        pasteCount: 0
      };
      notify(`${nodeDisplayName(node)}をコピーしました`);
      return true;
    }

    function pasteCopiedCard() {
      if (!cardClipboard?.node) return false;
      const scenario = getActiveScenario();
      const source = cardClipboard.node;
      const point = pastedCardPoint(cardClipboard.pasteCount || 0);
      const id = uniquePastedNodeId(scenario);
      const pasted = {
        ...source,
        id,
        parent: validPastedParent(source.parent, scenario),
        x: snap(point.x),
        y: snap(point.y)
      };
      pushHistory();
      scenario.nodes.push(pasted);
      cardClipboard.pasteCount = (cardClipboard.pasteCount || 0) + 1;
      selectedNodeId = id;
      selectedKnotId = null;
      selectedZoneId = null;
      actionPulseNodeId = id;
      notify(`${nodeDisplayName(pasted)}を貼り付けました`);
      render();
      return true;
    }

    function pastedCardPoint(index) {
      const centerX = (boardScrollEl.scrollLeft + boardScrollEl.clientWidth / 2) / viewport.scale;
      const centerY = (boardScrollEl.scrollTop + boardScrollEl.clientHeight / 2) / viewport.scale;
      const offset = GRID * Math.min(index, 8);
      return {
        x: Math.max(0, centerX - CARD.width / 2 + offset),
        y: Math.max(0, centerY - CARD.height / 2 + offset)
      };
    }

    function uniquePastedNodeId(scenario) {
      let id = "";
      do {
        id = `node-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 6)}`;
      } while (scenario.nodes.some((node) => node.id === id));
      return id;
    }

    function validPastedParent(parentId, scenario) {
      if (!parentId) return null;
      if (scenario.nodes.some((node) => node.id === parentId)) return parentId;
      if ((scenario.knots || []).some((knot) => knot.id === parentId)) return parentId;
      return null;
    }

    function deleteSelectedNode() {
      const scenario = getActiveScenario();
      const deleted = scenario.nodes.find((node) => node.id === selectedNodeId);
      if (!deleted) return;
      pushHistory();
      scenario.nodes = scenario.nodes.filter((node) => node.id !== deleted.id);
      scenario.nodes.forEach((node) => {
        if (node.parent === deleted.id) node.parent = deleted.parent || null;
      });
      (scenario.knots || []).forEach((knot) => {
        if (knot.parent === deleted.id) knot.parent = deleted.parent || null;
      });
      selectedNodeId = scenario.nodes.some((node) => node.id === deleted.parent)
        ? deleted.parent
        : scenario.nodes[0]?.id || null;
      notify("カードを削除しました");
      render();
    }

    function deleteSelectedKnot() {
      const scenario = getActiveScenario();
      if (!scenario.knots?.some((knot) => knot.id === selectedKnotId)) return;
      pushHistory();
      scenario.knots = scenario.knots.filter((knot) => knot.id !== selectedKnotId);
      scenario.nodes.forEach((node) => {
        if (node.parent === selectedKnotId) node.parent = null;
      });
      (scenario.knots || []).forEach((knot) => {
        if (knot.parent === selectedKnotId) knot.parent = null;
      });
      selectedKnotId = null;
      selectedZoneId = null;
      notify("線ノットを削除しました");
      render();
    }

    function duplicateScenario(sourceId = activeScenarioId) {
      const source = state.scenarios.find((scenario) => scenario.id === sourceId) || getActiveScenario();
      if (!source) return;
      pushHistory();
      const id = `scenario-${Date.now().toString(36)}`;
      const payload = cloneScenarioPayload(source);
      const copy = {
        id,
        name: `${source.name} コピー`,
        nodes: payload.nodes,
        knots: payload.knots,
        extZone: payload.extZone,
        extraZones: payload.extraZones.map((zone) => ({ ...zone })),
        canvasVersion: payload.canvasVersion
      };
      const sourceIndex = state.scenarios.findIndex((scenario) => scenario.id === source.id);
      state.scenarios.splice(sourceIndex + 1, 0, copy);
      activeScenarioId = id;
      selectedNodeId = copy.nodes[0]?.id || null;
      selectedKnotId = null;
      selectedZoneId = null;
      notify("案を複製しました");
      render();
    }

    function copyCurrentToPlans() {
      const current = state.scenarios.find((scenario) => scenario.id === "current") || state.scenarios[0];
      let plans = state.scenarios.filter((scenario) =>
        scenario.id === "plan-load" ||
        scenario.id === "plan-reduce" ||
        /^案[AB]/.test(scenario.name)
      );
      if (!plans.length) plans = state.scenarios.filter((scenario) => scenario.id !== current.id).slice(0, 2);
      if (!current || !plans.length) return;
      if (!confirm("現行体制を案A/Bへコピーしますか。案側の編集内容は上書きされます。")) return;
      pushHistory();
      const payload = cloneScenarioPayload(current);
      plans.forEach((scenario) => {
        scenario.nodes = cloneNodes(payload.nodes);
        scenario.knots = payload.knots.map((knot) => ({ ...knot }));
        scenario.extZone = payload.extZone ? { ...payload.extZone } : null;
        scenario.extraZones = payload.extraZones.map((zone) => ({ ...zone }));
        scenario.canvasVersion = payload.canvasVersion;
      });
      notify("現行を案A/Bへコピーしました");
      render();
    }

    function renameScenario(id = activeScenarioId) {
      const target = state.scenarios.find((scenario) => scenario.id === id) || getActiveScenario();
      if (!target) return;
      const name = prompt("案名", target.name);
      if (!name || !name.trim()) return;
      pushHistory();
      target.name = name.trim();
      notify("案名を変更しました");
      render();
    }

    function deleteScenario(id) {
      const index = state.scenarios.findIndex((scenario) => scenario.id === id);
      if (index < 0) return;
      if (state.scenarios.length <= 1) {
        notify("最後の案は削除できません");
        return;
      }
      const scenario = state.scenarios[index];
      if (!confirm(`「${scenario.name}」を削除しますか？`)) return;
      pushHistory();
      state.scenarios.splice(index, 1);
      if (activeScenarioId === id) {
        const next = state.scenarios[Math.min(index, state.scenarios.length - 1)];
        activeScenarioId = next.id;
        selectedNodeId = next.nodes[0]?.id || null;
        selectedKnotId = null;
        selectedZoneId = null;
      }
      notify("案を削除しました");
      render();
    }

    function resetSamples() {
      if (!confirm("空の初期状態に戻しますか。保存済みの案は上書きされます。")) return;
      pushHistory();
      state = createDefaultState();
      activeScenarioId = "current";
      selectedNodeId = null;
      selectedKnotId = null;
      selectedZoneId = null;
      autoCenteredScenarioIds.clear();
      localStorage.removeItem(STORAGE_KEY);
      notify("初期状態に戻しました");
      render();
    }

    function downloadJson(data, filename = "org-simulator-data.json") {
      const blob = new Blob([data], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }

    function exportJson() {
      downloadJson(JSON.stringify(state, null, 2));
      notify("JSONを書き出しました");
    }

    async function exportPng() {
      const layout = currentLayout || buildLayout(getCurrentNodes());
      if (!layout) return;
      const bounds = exportImageBounds(layout);
      const width = Math.max(1, Math.ceil(bounds.maxX - bounds.minX));
      const height = Math.max(1, Math.ceil(bounds.maxY - bounds.minY));
      if (width > 32767 || height > 32767 || width * height > 120000000) {
        notify("PNG範囲が大きすぎます。図を少し近づけてから保存してください");
        return;
      }
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext("2d");
      if (!ctx) {
        notify("PNG作成に失敗しました");
        return;
      }
      ctx.save();
      ctx.translate(-bounds.minX, -bounds.minY);
      const avatarImages = await preloadPngAvatars(layout.nodes);
      drawPngBackground(ctx, bounds);
      drawPngZones(ctx, layout);
      drawPngLinks(ctx, layout);
      drawPngKnots(ctx, layout);
      drawPngNodes(ctx, layout, avatarImages);
      ctx.restore();
      canvas.toBlob((blob) => {
        if (!blob) {
          notify("PNG作成に失敗しました");
          return;
        }
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `${safeFileName(getActiveScenario().name || "体制図")}-100pct.png`;
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
        notify(`PNGを書き出しました（${width}×${height}px）`);
      }, "image/png");
    }

    function exportImageBounds(layout) {
      const padding = 120;
      const contentBounds = layout.contentBounds || layoutContentBounds([...layout.positions.values()], layout.knots || [], layout.zones || []);
      return {
        minX: Math.max(0, Math.floor(contentBounds.minX - padding)),
        minY: Math.max(0, Math.floor(contentBounds.minY - padding)),
        maxX: Math.min(layout.boardWidth, Math.ceil(contentBounds.maxX + padding)),
        maxY: Math.min(layout.boardHeight, Math.ceil(contentBounds.maxY + padding))
      };
    }

    function drawPngBackground(ctx, bounds) {
      ctx.fillStyle = "#08131d";
      ctx.fillRect(bounds.minX, bounds.minY, bounds.maxX - bounds.minX, bounds.maxY - bounds.minY);
      ctx.strokeStyle = "rgba(83, 150, 170, .16)";
      ctx.lineWidth = 1;
      const grid = 40;
      const startX = Math.floor(bounds.minX / grid) * grid;
      const startY = Math.floor(bounds.minY / grid) * grid;
      for (let x = startX; x <= bounds.maxX; x += grid) {
        ctx.beginPath();
        ctx.moveTo(x, bounds.minY);
        ctx.lineTo(x, bounds.maxY);
        ctx.stroke();
      }
      for (let y = startY; y <= bounds.maxY; y += grid) {
        ctx.beginPath();
        ctx.moveTo(bounds.minX, y);
        ctx.lineTo(bounds.maxX, y);
        ctx.stroke();
      }
    }

    function drawPngZones(ctx, layout) {
      (layout.zones || []).forEach((zone) => {
        ctx.save();
        ctx.fillStyle = zone.locked ? "rgba(37, 47, 59, .78)" : "rgba(27, 66, 76, .56)";
        ctx.strokeStyle = zone.locked ? "rgba(135, 158, 178, .6)" : "rgba(41, 206, 218, .72)";
        ctx.lineWidth = 1;
        drawRoundRect(ctx, zone.x, zone.y, zone.width, zone.height, 18);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = zone.locked ? "#c3d3de" : "#d4f8fb";
        ctx.font = '800 13px "Segoe UI", "Yu Gothic UI", Meiryo, sans-serif';
        ctx.textAlign = "left";
        ctx.textBaseline = "top";
        ctx.fillText(zone.label || "追加枠", zone.x + 18, zone.y + 14);
        ctx.restore();
      });
    }

    function drawPngLinks(ctx, layout) {
      buildKnotParentRoutes(layout).forEach((route) => {
        strokeCanvasDirectPath(ctx, route.source.x, route.source.y, route.target.x, route.target.y, false);
      });
      const routes = buildLinkRoutes(layout);
      const grouped = new Map();
      routes.forEach((route) => {
        if (!route.knot) return;
        const key = `${route.knot.id}|${route.parentId}`;
        if (!grouped.has(key)) grouped.set(key, []);
        grouped.get(key).push(route);
      });
      const groupedRouteIds = new Set();
      grouped.forEach((group) => {
        if (group.length < 2) return;
        const first = group[0];
        const parentSource = anchorEdgePoint(first.parentAnchor, { x: first.knot.x, y: first.knot.y });
        strokeCanvasDirectPath(ctx, parentSource.x, parentSource.y, first.knot.x, first.knot.y, group.every((route) => route.removed));
        group.forEach((route) => {
          groupedRouteIds.add(route.linkId);
          strokeCanvasDirectPath(ctx, route.knot.x, route.knot.y, route.target.x, route.target.y, route.removed);
        });
      });
      routes.forEach((route) => {
        if (groupedRouteIds.has(route.linkId)) return;
        if (route.knot) {
          strokeCanvasKnotPath(ctx, route.source.x, route.source.y, route.knot.x, route.knot.y, route.target.x, route.target.y, route.removed);
        } else {
          strokeCanvasDirectPath(ctx, route.source.x, route.source.y, route.target.x, route.target.y, route.removed);
        }
      });
    }

    function buildLinkRoutes(layout) {
      const routes = [];
      layout.nodes.forEach((node) => {
        if (!node.parent || !layout.positions.has(node.id)) return;
        const parentAnchor = getParentAnchor(layout, node.parent);
        if (!parentAnchor) return;
        const child = layout.positions.get(node.id);
        const parentCenter = anchorCenter(parentAnchor);
        const childCenter = { x: child.x + child.width / 2, y: child.y + child.height / 2 };
        const source = anchorEdgePoint(parentAnchor, childCenter);
        const target = edgePoint(child, parentCenter);
        const linkId = linkIdFor(node);
        const knot = findRouteKnot(source, target, layout.knots, linkId, parentAnchor.type === "knot" ? [parentAnchor.id] : []);
        routes.push({ node, parentId: node.parent, parentAnchor, child, source, target, knot, linkId, removed: node.status === "removed" });
      });
      return routes;
    }

    function buildKnotParentRoutes(layout) {
      const routes = [];
      (layout.knots || []).forEach((knot) => {
        if (!knot.parent || knot.parent === knot.id) return;
        const parentAnchor = getParentAnchor(layout, knot.parent);
        if (!parentAnchor) return;
        const target = { x: knot.x, y: knot.y };
        const source = anchorEdgePoint(parentAnchor, target);
        routes.push({ knot, parentId: knot.parent, parentAnchor, source, target, linkId: `${knot.parent}->${knot.id}` });
      });
      return routes;
    }

    function strokeCanvasDirectPath(ctx, x1, y1, x2, y2, removed = false) {
      const bend = Math.max(56, Math.abs(x2 - x1) * .45);
      const direction = x2 >= x1 ? 1 : -1;
      ctx.save();
      prepareCanvasLinkStroke(ctx, removed);
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.bezierCurveTo(x1 + bend * direction, y1, x2 - bend * direction, y2, x2, y2);
      ctx.stroke();
      ctx.restore();
    }

    function strokeCanvasKnotPath(ctx, x1, y1, kx, ky, x2, y2, removed = false) {
      const bendA = Math.max(36, Math.abs(kx - x1) * .34);
      const bendB = Math.max(36, Math.abs(x2 - kx) * .34);
      const dirA = kx >= x1 ? 1 : -1;
      const dirB = x2 >= kx ? 1 : -1;
      ctx.save();
      prepareCanvasLinkStroke(ctx, removed);
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.bezierCurveTo(x1 + bendA * dirA, y1, kx - bendA * dirA, ky, kx, ky);
      ctx.bezierCurveTo(kx + bendB * dirB, ky, x2 - bendB * dirB, y2, x2, y2);
      ctx.stroke();
      ctx.restore();
    }

    function prepareCanvasLinkStroke(ctx, removed) {
      ctx.strokeStyle = "#24cbe1";
      ctx.lineWidth = 2;
      ctx.lineCap = "round";
      ctx.globalAlpha = removed ? .55 : 1;
      ctx.setLineDash(removed ? [7, 6] : []);
    }

    function drawPngKnots(ctx, layout) {
      (layout.knots || []).forEach((knot) => {
        ctx.save();
        ctx.beginPath();
        ctx.arc(knot.x, knot.y, KNOT_SIZE / 2, 0, Math.PI * 2);
        ctx.fillStyle = knot.locked ? "#282044" : "#0d2731";
        ctx.strokeStyle = knot.locked ? "#a78bfa" : "#3ce2ef";
        ctx.lineWidth = 3;
        ctx.fill();
        ctx.stroke();
        if (knot.locked) {
          ctx.fillStyle = "#ded6ff";
          ctx.font = '800 10px "Segoe UI", sans-serif';
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText("L", knot.x, knot.y + .5);
        }
        ctx.restore();
      });
    }

    async function preloadPngAvatars(nodes) {
      const sources = [...new Set(nodes.map((node) => safeSlackAvatar(node.slackAvatar)).filter(Boolean))];
      const entries = await Promise.all(sources.map((source) => new Promise((resolve) => {
        const image = new Image();
        image.onload = () => resolve([source, image]);
        image.onerror = () => resolve([source, null]);
        image.src = source;
      })));
      return new Map(entries.filter(([, image]) => image));
    }

    function drawPngNodes(ctx, layout, avatarImages) {
      layout.nodes.forEach((node) => {
        const pos = layout.positions.get(node.id);
        if (!pos) return;
        drawPngNode(ctx, node, pos, layout.nodeMap, avatarImages.get(node.slackAvatar));
      });
    }

    function drawPngNode(ctx, node, pos, nodeMap, avatarImage) {
      const style = nodeCanvasStyle(node, nodeMap);
      ctx.save();
      drawRoundRect(ctx, pos.x, pos.y, pos.width, pos.height, 34);
      ctx.fillStyle = style.fill;
      ctx.fill();
      ctx.save();
      drawRoundRect(ctx, pos.x, pos.y, pos.width, pos.height, 34);
      ctx.clip();
      ctx.fillStyle = style.accent;
      ctx.fillRect(pos.x, pos.y, pos.width, 7);
      ctx.restore();
      ctx.strokeStyle = style.stroke;
      ctx.lineWidth = style.risk ? 3 : 1.5;
      ctx.setLineDash(style.dashed ? [7, 5] : []);
      ctx.stroke();
      ctx.setLineDash([]);
      const textX = pos.x + 78;
      const textWidth = pos.width - 92;
      if (avatarImage) {
        drawCanvasAvatar(ctx, avatarImage, pos.x + 14, pos.y + 26, 52);
      } else {
        drawCanvasDefaultAvatar(ctx, pos.x + 14, pos.y + 26, 52);
      }
      drawLeftCanvasText(ctx, node.role || "役割未設定", textX, pos.y + 21, textWidth, 13, 2, '800 12px "Segoe UI", "Yu Gothic UI", Meiryo, sans-serif', "#f4fbff");
      drawLeftCanvasText(ctx, nodeDisplayName(node), textX, pos.y + 39, textWidth, 20, 1, '900 20px "Segoe UI", "Yu Gothic UI", Meiryo, sans-serif', "#f4fbff");
      ctx.strokeStyle = "rgba(247,253,255,.88)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(textX, pos.y + 67);
      ctx.lineTo(pos.x + pos.width - 14, pos.y + 67);
      ctx.stroke();
      const metaLabel = canvasPillItems(node).map((item) => item.label).join(" / ");
      drawLeftCanvasText(ctx, metaLabel, textX, pos.y + 75, textWidth, 12, 1, '800 11px "Segoe UI", "Yu Gothic UI", Meiryo, sans-serif', "#f5fbff");
      ctx.restore();
    }

    function nodeCanvasStyle(node, nodeMap) {
      const paletteKey = node.colorOverride || automaticPaletteKey(node);
      const palette = canvasPalette(paletteKey);
      const risk = !node.colorOverride && (node.status === "risk" || (node.parent && nodeMap.get(node.parent)?.status === "removed"));
      const dashed = node.borderStyleOverride === "dashed"
        ? true
        : (node.borderStyleOverride === "solid" ? false : palette.dashed);
      return { ...palette, stroke: risk ? "#ef4444" : palette.stroke, dashed, risk };
    }

    function automaticPaletteKey(node) {
      if (node.status === "removed") return "removed";
      if (node.status === "hiring") return "hiring";
      if (node.status === "candidate") return "candidate";
      if (node.status === "added") return "added";
      if (node.lane === "external") return "external";
      return "core";
    }

    function canvasPalette(key) {
      const palettes = {
        core: { fill: "#287ead", accent: "#168fd1", stroke: "#91e5f5", dashed: false },
        external: { fill: "#a77a24", accent: "#f59e0b", stroke: "#ffe08c", dashed: false },
        added: { fill: "#258b69", accent: "#31d2a4", stroke: "#a8f2cf", dashed: false },
        candidate: { fill: "#7354bb", accent: "#a78bfa", stroke: "#cdbdff", dashed: true },
        hiring: { fill: "#c58522", accent: "#f6b53d", stroke: "#ffe7a0", dashed: true },
        removed: { fill: "#60758a", accent: "#94a3b8", stroke: "#c0cfdb", dashed: true }
      };
      return palettes[key] || palettes.core;
    }

    function drawCanvasPills(ctx, node, x, y, maxWidth) {
      const items = canvasPillItems(node);
      if (!items.length) return;
      ctx.font = '800 10px "Segoe UI", "Yu Gothic UI", Meiryo, sans-serif';
      const visible = [];
      let total = 0;
      items.forEach((item) => {
        let width = Math.ceil(ctx.measureText(item.label).width) + 13;
        if (visible.length && total + width + 5 > maxWidth) return;
        if (!visible.length && width > maxWidth) {
          item.label = fitCanvasText(ctx, item.label, maxWidth - 13);
          width = maxWidth;
        }
        visible.push({ ...item, width });
        total += width + (visible.length > 1 ? 5 : 0);
      });
      let cursor = x + (maxWidth - Math.min(total, maxWidth)) / 2;
      visible.forEach((item) => {
        drawRoundRect(ctx, cursor, y, item.width, 18, 9);
        ctx.fillStyle = item.fill;
        ctx.fill();
        ctx.strokeStyle = item.stroke;
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.fillStyle = item.color;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(item.label, cursor + item.width / 2, y + 9.5);
        cursor += item.width + 5;
      });
    }

    function canvasPillItems(node) {
      const items = [];
      if (node.team) items.push({ label: node.team, fill: "rgba(5,14,21,.52)", stroke: "rgba(174,218,231,.26)", color: "#d5e7ef" });
      const requirementLabel = node.requirement ? "要件あり" : (node.hiring ? "採用" : "");
      if (requirementLabel) items.push({ label: requirementLabel, fill: "#17372d", stroke: "#2f8369", color: "#a8f1d4" });
      const diff = diffLabel(node);
      if (diff) items.push({ label: diff, fill: "#20394b", stroke: "#3c7490", color: "#e8fbff" });
      return items;
    }

    function drawCenteredCanvasText(ctx, text, x, y, width, lineHeight, maxLines, font, color) {
      ctx.font = font;
      ctx.fillStyle = color;
      ctx.textAlign = "center";
      ctx.textBaseline = "top";
      wrapCanvasText(ctx, text, width, maxLines).forEach((line, index) => {
        ctx.fillText(line, x + width / 2, y + index * lineHeight);
      });
    }

    function drawLeftCanvasText(ctx, text, x, y, width, lineHeight, maxLines, font, color) {
      ctx.font = font;
      ctx.fillStyle = color;
      ctx.textAlign = "left";
      ctx.textBaseline = "top";
      wrapCanvasText(ctx, text, width, maxLines).forEach((line, index) => {
        ctx.fillText(line, x, y + index * lineHeight);
      });
    }

    function drawCanvasAvatar(ctx, image, x, y, size) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(x + size / 2, y + size / 2, size / 2, 0, Math.PI * 2);
      ctx.clip();
      ctx.drawImage(image, x, y, size, size);
      ctx.restore();
      ctx.save();
      ctx.beginPath();
      ctx.arc(x + size / 2, y + size / 2, size / 2 - .5, 0, Math.PI * 2);
      ctx.strokeStyle = "rgba(218, 253, 255, .76)";
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.restore();
    }

    function drawCanvasDefaultAvatar(ctx, x, y, size) {
      const centerX = x + size / 2;
      ctx.save();
      ctx.beginPath();
      ctx.arc(centerX, y + size / 2, size / 2, 0, Math.PI * 2);
      ctx.fillStyle = "#e7f5fa";
      ctx.fill();
      ctx.clip();
      ctx.fillStyle = "#4c8093";
      ctx.beginPath();
      ctx.arc(centerX, y + 18, 8, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(centerX, y + size + 6, 18, 18, 0, Math.PI, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      ctx.beginPath();
      ctx.arc(centerX, y + size / 2, size / 2 - 1, 0, Math.PI * 2);
      ctx.strokeStyle = "rgba(245,253,255,.94)";
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    function wrapCanvasText(ctx, text, maxWidth, maxLines) {
      const chars = Array.from(`${text || ""}`);
      const lines = [];
      let current = "";
      chars.forEach((char) => {
        const next = current + char;
        if (current && ctx.measureText(next).width > maxWidth) {
          lines.push(current);
          current = char;
        } else {
          current = next;
        }
      });
      if (current) lines.push(current);
      if (!lines.length) lines.push("");
      if (lines.length > maxLines) {
        const clipped = lines.slice(0, maxLines);
        clipped[maxLines - 1] = fitCanvasText(ctx, clipped[maxLines - 1] + lines.slice(maxLines).join(""), maxWidth);
        return clipped;
      }
      return lines;
    }

    function fitCanvasText(ctx, text, maxWidth) {
      const chars = Array.from(`${text || ""}`);
      let value = "";
      for (const char of chars) {
        if (ctx.measureText(value + char + "…").width > maxWidth) return value ? `${value}…` : "…";
        value += char;
      }
      return value;
    }

    function drawRoundRect(ctx, x, y, width, height, radius) {
      const r = Math.min(radius, width / 2, height / 2);
      ctx.beginPath();
      if (ctx.roundRect) {
        ctx.roundRect(x, y, width, height, r);
        return;
      }
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + width - r, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + r);
      ctx.lineTo(x + width, y + height - r);
      ctx.quadraticCurveTo(x + width, y + height, x + width - r, y + height);
      ctx.lineTo(x + r, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    function safeFileName(value) {
      return `${value}`.trim().replace(/[\\/:*?"<>|]/g, "_").replace(/\s+/g, "_") || "体制図";
    }

    async function writeJsonToHandle(handle, data) {
      const allowed = await ensureHandlePermission(handle, "readwrite");
      if (!allowed) throw new Error("permission");
      const writable = await handle.createWritable();
      await writable.write(data);
      await writable.close();
    }

    async function saveExternalFile() {
      const data = JSON.stringify(state, null, 2);
      try {
        if (fileHandle && fileAccessAvailable()) {
          await writeJsonToHandle(fileHandle, data);
          await rememberFileHandle(fileHandle);
          notify(`${fileHandle.name || "ファイル"}に上書き保存しました`);
          return;
        }
        await saveAsExternalFile();
      } catch (error) {
        if (error?.name !== "AbortError") notify("保存に失敗しました");
      }
    }

    async function saveAsExternalFile() {
      const data = JSON.stringify(state, null, 2);
      try {
        if ("showSaveFilePicker" in window) {
          const handle = await window.showSaveFilePicker({
            suggestedName: fileHandle?.name || "org-simulator-data.json",
            types: filePickerTypes()
          });
          await writeJsonToHandle(handle, data);
          await rememberFileHandle(handle);
          notify(`${handle.name || "ファイル"}として保存しました`);
          return;
        }
        downloadJson(data);
        notify("ダウンロードとして保存しました");
      } catch (error) {
        if (error?.name !== "AbortError") notify("保存に失敗しました");
      }
    }

    async function importJson(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      try {
        const text = await file.text();
        applyImportedState(JSON.parse(text));
        fileHandle = null;
        currentFileId = null;
        renderRecentFiles();
        notify("JSONを読み込みました");
      } catch (error) {
        notify("読み込みに失敗しました");
      } finally {
        fileInputEl.value = "";
      }
    }

    function isDescendant(candidateId, ancestorId) {
      const nodeMap = new Map(getCurrentNodes().map((node) => [node.id, node]));
      const knotMap = new Map(getCurrentKnots().map((knot) => [knot.id, knot]));
      let currentId = candidateId;
      const seen = new Set();
      while (currentId && !seen.has(currentId)) {
        if (currentId === ancestorId) return true;
        seen.add(currentId);
        const current = nodeMap.get(currentId) || knotMap.get(currentId);
        currentId = current?.parent || null;
      }
      return false;
    }

    function escapeHtml(value) {
      return `${value}`
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function escapeAttr(value) {
      return escapeHtml(value).replaceAll("\n", " ");
    }

    let toastTimer = null;
    function notify(message) {
      toastEl.textContent = message;
      toastEl.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove("show"), 1500);
    }
  </script>
</body>
