<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>体制シミュレーター</title>
  <style>
    :root {
      --bg: #e7edf2;
      --surface: #ffffff;
      --ink: #20242a;
      --muted: #68707d;
      --line: #1298cc;
      --core: #cfe7ff;
      --external: #ffd54f;
      --added: #c9f3d2;
      --candidate: #ecddff;
      --hiring: #ffe08a;
      --removed: #e7e7e2;
      --risk: #ef4444;
      --green: #0f8f68;
      --violet: #7552bf;
      --panel: #f7f9fb;
      --border: #d6dfe7;
      --board-bg: #edf2f5;
      --card-shadow: 0 10px 20px rgba(21, 29, 38, .14), 0 2px 4px rgba(21, 29, 38, .07);
      --shadow: 0 16px 34px rgba(31, 36, 43, .14);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--bg);
      font-family: "Segoe UI", "Yu Gothic UI", "Hiragino Sans", Meiryo, sans-serif;
      min-height: 0;
      overflow: visible;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      border: 1px solid transparent;
      background: var(--surface);
      color: var(--ink);
      cursor: pointer;
      transition: background .15s ease, border-color .15s ease, box-shadow .15s ease, color .15s ease, transform .12s ease;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: .42;
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible {
      outline: 3px solid rgba(14, 165, 199, .24);
      outline-offset: 2px;
    }

    .app {
      display: grid;
      grid-template-rows: 66px 1fr;
      height: 100vh;
      min-height: 0;
      overflow: hidden;
    }

    .topbar {
      display: grid;
      grid-template-columns: minmax(240px, 380px) 1fr auto;
      align-items: center;
      gap: 18px;
      padding: 0 20px;
      background: rgba(255, 255, 255, .96);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(10px);
      box-shadow: 0 6px 18px rgba(31, 36, 43, .08);
      position: relative;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .mark {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      background:
        linear-gradient(135deg, #14b8a6 0 45%, transparent 45%),
        linear-gradient(315deg, #ef4444 0 45%, transparent 45%),
        #20242a;
      box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .9);
      flex: 0 0 auto;
    }

    .brand h1 {
      margin: 0;
      font-size: 18px;
      line-height: 1.1;
      letter-spacing: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .scenario-tabs {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      overflow-x: auto;
      scrollbar-width: thin;
      padding: 8px 2px 4px;
    }

    .tab-item {
      position: relative;
      flex: 0 0 auto;
    }

    .tab {
      height: 36px;
      min-width: 72px;
      max-width: 180px;
      padding: 0 16px;
      border-radius: 12px;
      border-color: var(--border);
      color: #3f4650;
      background: #f3f6f8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tab.active {
      background: #087fb2;
      color: #fff;
      border-color: #087fb2;
      box-shadow: 0 5px 12px rgba(8, 127, 178, .2);
    }

    .tab-actions {
      position: absolute;
      top: -7px;
      right: -7px;
      display: flex;
      gap: 3px;
      opacity: 0;
      transform: translateY(2px);
      pointer-events: none;
      transition: opacity .14s ease, transform .14s ease;
      z-index: 3;
    }

    .scenario-tabs:hover .tab-actions,
    .tab-item:focus-within .tab-actions {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .tab-mini {
      width: 20px;
      height: 20px;
      padding: 0;
      border-radius: 999px;
      border: 1px solid rgba(32, 36, 42, .18);
      background: #fff;
      color: #20242a;
      font-size: 14px;
      font-weight: 900;
      line-height: 1;
      box-shadow: 0 4px 12px rgba(32, 36, 42, .16);
    }

    .tab-mini.delete {
      color: #b3261e;
      border-color: rgba(179, 38, 30, .22);
      background: #fff8f7;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .file-controls {
      display: flex;
      align-items: center;
      gap: 4px;
      min-width: 0;
    }

    .recent-file-select {
      width: 190px;
      max-width: 24vw;
      height: 36px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fff;
      color: var(--ink);
      padding: 0 9px;
      font-size: 12px;
      font-weight: 700;
    }

    .recent-file-remove {
      width: 28px;
      height: 28px;
      padding: 0;
      border-radius: 999px;
      border-color: var(--border);
      background: #fff8f7;
      color: #b3261e;
      font-size: 16px;
      font-weight: 900;
      line-height: 1;
    }

    .icon-btn,
    .text-btn {
      height: 36px;
      border-radius: 10px;
      border-color: var(--border);
      background: #fbfcfd;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      font-weight: 700;
      color: #252a32;
    }

    .icon-btn:hover,
    .text-btn:hover,
    .board-size-btn:hover,
    .recent-file-remove:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 18px rgba(31, 36, 43, .12);
    }

    .icon-btn:active,
    .text-btn:active,
    .board-size-btn:active,
    .recent-file-remove:active {
      transform: translateY(0) scale(.98);
    }

    .icon-btn {
      width: 38px;
      padding: 0;
      font-size: 19px;
    }

    .text-btn {
      padding: 0 12px;
      font-size: 13px;
    }

    .text-btn.primary {
      background: #0d93c5;
      border-color: #087eac;
      color: #fff;
    }

    .text-btn.warn {
      background: #fff6f4;
      color: #b3261e;
      border-color: #f0c7c2;
    }

    .main {
      display: grid;
      grid-template-columns: 74px minmax(0, 1fr) 360px;
      height: calc(100vh - 66px);
      min-height: 0;
      overflow: hidden;
    }

    .main.board-maximized {
      grid-template-columns: minmax(0, 1fr);
    }

    .main.board-maximized .rail,
    .main.board-maximized .inspector {
      display: none;
    }

    .main.board-maximized .workspace {
      grid-column: 1 / -1;
      width: 100%;
    }

    .rail {
      position: sticky;
      top: 66px;
      height: calc(100vh - 66px);
      background: #f8fafc;
      border-right: 1px solid var(--border);
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      overflow-y: auto;
      overflow-x: hidden;
      z-index: 12;
    }

    .rail .icon-btn {
      width: 48px;
      height: 48px;
      border-radius: 16px;
      background: #fff;
      border-color: #d4e1e8;
      box-shadow: 0 5px 12px rgba(31, 41, 55, .07);
    }

    .rail .divider {
      width: 36px;
      height: 1px;
      background: var(--border);
      margin: 3px 0;
    }

    .workspace {
      min-width: 0;
      min-height: 0;
      height: 100%;
      display: grid;
      grid-template-rows: 52px 1fr;
      overflow: hidden;
    }

    .contextbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 16px;
      border-bottom: 1px solid var(--border);
      background: rgba(248, 250, 252, .92);
      box-shadow: 0 1px 0 rgba(255, 255, 255, .88) inset;
    }

    .search {
      min-width: 230px;
      height: 36px;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0 12px;
      background: #fff;
      color: var(--ink);
    }

    .stats {
      display: flex;
      gap: 8px;
      align-items: center;
      min-width: 0;
      overflow-x: auto;
      scrollbar-width: thin;
    }

    .context-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .board-size-btn {
      flex: 0 0 auto;
      height: 34px;
      min-width: 58px;
      padding: 0 10px;
      border-radius: 10px;
      border-color: var(--border);
      background: #fbfcfd;
      color: #252a32;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .board-size-btn:hover,
    .board-size-btn:focus-visible {
      background: #087fb2;
      border-color: #087fb2;
      color: #fff;
    }

    .stat {
      min-width: 76px;
      height: 34px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #fff;
      display: grid;
      place-items: center;
      padding: 3px 9px;
      white-space: nowrap;
      box-shadow: 0 3px 9px rgba(31, 36, 43, .06);
    }

    .stat b {
      font-size: 14px;
      line-height: 1;
    }

    .stat span {
      font-size: 10px;
      color: var(--muted);
      line-height: 1;
    }

    .board-scroll {
      position: relative;
      min-height: 0;
      height: 100%;
      overflow: auto;
      padding: 22px 22px 78px;
      cursor: grab;
      overscroll-behavior: contain;
      background: #dfe7ed;
    }

    .board-scroll.panning,
    .board-scroll.zooming {
      cursor: grabbing;
    }

    .board {
      position: relative;
      min-width: 1060px;
      min-height: 720px;
      background:
        linear-gradient(0deg, rgba(18, 152, 204, .08) 0 70px, transparent 70px),
        linear-gradient(180deg, #f8fafb 0%, var(--board-bg) 100%);
      border: 1px solid #c2cbd4;
      box-shadow: var(--shadow);
      border-radius: 18px;
      overflow: hidden;
      transform-origin: 0 0;
    }

    .board::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(32, 36, 42, .07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(32, 36, 42, .07) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    .zone {
      position: absolute;
      border-radius: 22px;
      border: 1px solid rgba(198, 126, 31, .28);
      background: rgba(255, 218, 179, .5);
      pointer-events: auto;
      cursor: grab;
      z-index: 1;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .5), 0 12px 30px rgba(198, 126, 31, .08);
    }

    .zone.dragging {
      cursor: grabbing;
      outline: 4px solid rgba(198, 126, 31, .18);
    }

    .zone.locked {
      cursor: default;
      background: rgba(226, 232, 240, .48);
      border-color: rgba(100, 116, 139, .34);
    }

    .zone.selected {
      border-color: #0d93c5;
      outline: 3px solid rgba(13, 147, 197, .22);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .5), 0 0 0 1px rgba(255, 255, 255, .92), 0 14px 28px rgba(13, 147, 197, .16);
    }

    .zone-label {
      position: absolute;
      top: 14px;
      left: 18px;
      font-size: 13px;
      font-weight: 800;
      color: #7c3f10;
      pointer-events: none;
    }

    .zone.locked .zone-label {
      color: #475569;
    }

    .zone-lock {
      position: absolute;
      top: 10px;
      right: 12px;
      width: 30px;
      height: 28px;
      border-radius: 8px;
      border: 1px solid rgba(124, 63, 16, .28);
      background: rgba(255, 255, 255, .9);
      color: #3c424c;
      cursor: pointer;
      font-size: 15px;
      font-weight: 900;
      line-height: 1;
      display: grid;
      place-items: center;
      box-shadow: 0 3px 8px rgba(32, 36, 42, .08);
      opacity: 0;
      pointer-events: none;
      translate: 0 -3px;
      transition: opacity .14s ease, translate .14s ease;
    }

    .zone:hover .zone-lock {
      opacity: 1;
      pointer-events: auto;
      translate: 0 0;
    }

    .zone.locked .zone-lock {
      border-color: rgba(71, 85, 105, .34);
      color: #475569;
    }

    .zone-handle {
      position: absolute;
      background: rgba(255, 255, 255, .9);
      border: 1px solid rgba(124, 63, 16, .38);
      border-radius: 6px;
      box-shadow: 0 3px 8px rgba(32, 36, 42, .12);
      opacity: 0;
      pointer-events: none;
      transition: opacity .14s ease;
    }

    .zone:hover .zone-handle,
    .zone.dragging .zone-handle {
      opacity: 1;
      pointer-events: auto;
    }

    .zone.locked .zone-handle {
      opacity: 0;
      pointer-events: none;
    }

    .zone-handle.e {
      width: 12px;
      height: 54px;
      right: -7px;
      top: 50%;
      transform: translateY(-50%);
      cursor: ew-resize;
    }

    .zone-handle.s {
      width: 54px;
      height: 12px;
      left: 50%;
      bottom: -7px;
      transform: translateX(-50%);
      cursor: ns-resize;
    }

    .zone-handle.se {
      width: 16px;
      height: 16px;
      right: -8px;
      bottom: -8px;
      cursor: nwse-resize;
    }

    .links {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      overflow: visible;
    }

    .link {
      fill: none;
      stroke: var(--line);
      stroke-width: 2.2;
      stroke-linecap: round;
      filter: none;
    }

    .link-hit {
      fill: none;
      stroke: transparent;
      stroke-width: 26;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
      pointer-events: stroke;
      cursor: grab;
    }

    .link-hit.locked {
      cursor: not-allowed;
    }

    .link-hover-dot {
      fill: #e0f2fe;
      stroke: #086c8e;
      stroke-width: 2.5;
      vector-effect: non-scaling-stroke;
      opacity: 0;
      pointer-events: none;
      transform-box: fill-box;
      transform-origin: center;
      transform: scale(.72);
      transition: opacity .1s ease, transform .1s ease, fill .1s ease, stroke .1s ease;
    }

    .link-hover-dot.visible {
      opacity: 1;
      transform: scale(1);
    }

    .link-hover-dot.target {
      fill: #fef9c3;
      stroke: #d29a00;
    }

    .link-hover-dot.dragging {
      fill: #dcfce7;
      stroke: #0f8f68;
      transform: scale(1.2);
    }

    .link-hover-dot.locked.visible {
      fill: #ede9fe;
      stroke: #8b5cf6;
      opacity: .62;
    }

    .knot {
      position: absolute;
      z-index: 5;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 3px solid #0e7490;
      background: #ecfeff;
      box-shadow: 0 5px 12px rgba(32, 36, 42, .14);
      cursor: grab;
      touch-action: none;
    }

    .knot.selected {
      outline: 4px solid rgba(14, 116, 144, .22);
    }

    .knot.drop-target {
      outline: 5px solid rgba(15, 143, 104, .28);
      border-color: #0f8f68;
      background: #dcfce7;
    }

    .knot.locked {
      border-color: #7c3aed;
      background: #f3e8ff;
    }

    .knot.locked::after {
      content: "L";
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: #5b21b6;
      font-size: 10px;
      font-weight: 900;
    }

    .knot.dragging {
      cursor: grabbing;
      transform: scale(1.12);
    }

    .knot-label {
      position: absolute;
      z-index: 5;
      padding: 1px 5px;
      border-radius: 6px;
      border: 1px solid rgba(14, 116, 144, .22);
      background: rgba(255, 255, 255, .92);
      color: #0e7490;
      font-size: 10px;
      font-weight: 900;
      line-height: 1.25;
      pointer-events: none;
      opacity: 0;
      transform: translateY(2px);
      transition: opacity .12s ease, transform .12s ease;
    }

    .knot-label.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .node {
      --node-accent: #1298cc;
      --node-ring: rgba(18, 152, 204, .34);
      position: absolute;
      z-index: 3;
      width: 168px;
      min-height: 74px;
      border: 2px solid rgba(71, 85, 105, .84);
      border-radius: 32px;
      background: var(--core);
      display: grid;
      grid-template-rows: auto auto 1fr;
      gap: 4px;
      padding: 13px 10px 9px;
      box-shadow: var(--card-shadow);
      user-select: none;
      touch-action: none;
      cursor: grab;
      overflow: hidden;
      --float-duration: 5.8s;
      --float-delay: 0s;
      --float-rotate: .65deg;
      --float-x-start: -.6px;
      --float-y-start: 1.2px;
      --float-r-start: -.3deg;
      --float-x-peak: 1.4px;
      --float-y-peak: -4.2px;
      --float-r-peak: .5deg;
      --float-x-return: -1px;
      --float-y-return: -1.4px;
      --float-r-return: -.45deg;
      animation: card-float var(--float-duration) ease-in-out var(--float-delay) infinite;
      transition: transform .14s ease, box-shadow .14s ease, border-color .14s ease, opacity .12s ease, filter .14s ease;
    }

    .node:nth-of-type(4n) {
      --float-duration: 6.8s;
      --float-delay: -3.2s;
      --float-rotate: .88deg;
    }

    .node:nth-of-type(4n + 1) {
      --float-duration: 5.1s;
      --float-delay: -1.9s;
      --float-rotate: .52deg;
    }

    .node:nth-of-type(4n + 2) {
      --float-duration: 7.4s;
      --float-delay: -4.4s;
      --float-rotate: .78deg;
    }

    .node::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      right: 0;
      height: 7px;
      background: var(--node-accent);
      pointer-events: none;
    }

    .node > * {
      position: relative;
      z-index: 1;
    }

    .node:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 26px rgba(21, 29, 38, .18), 0 3px 8px rgba(21, 29, 38, .09);
    }

    .node.selected {
      border-color: #111827;
      outline: 3px solid rgba(18, 152, 204, .26);
      box-shadow: 0 0 0 1px rgba(255, 255, 255, .86), 0 14px 28px rgba(21, 29, 38, .2);
    }

    .node.dragging {
      cursor: grabbing;
      transform: translateY(-2px) scale(1.02);
      translate: 0 -5px;
      rotate: 0deg;
      z-index: 6;
      animation: none !important;
    }

    .node.drop-target {
      outline: 4px solid rgba(15, 143, 104, .24);
      border-color: var(--green);
    }

    .node.core {
      --node-accent: #168fd1;
      --node-ring: rgba(22, 143, 209, .3);
      border-color: var(--risk);
      background: var(--core);
      min-height: 86px;
    }

    .node.external {
      --node-accent: #f59e0b;
      --node-ring: rgba(245, 158, 11, .32);
      background: var(--external);
      border-color: #7d6500;
    }

    .node.added {
      --node-accent: #10b981;
      --node-ring: rgba(16, 185, 129, .3);
      background: var(--added);
      border-color: var(--green);
    }

    .node.candidate {
      --node-accent: #8b5cf6;
      --node-ring: rgba(139, 92, 246, .32);
      background: var(--candidate);
      border-color: var(--violet);
      border-style: dashed;
    }

    .node.hiring {
      --node-accent: #f97316;
      --node-ring: rgba(249, 115, 22, .34);
      background: var(--hiring);
      border-color: #9a6700;
      border-style: dashed;
    }

    .node.removed {
      --node-accent: #94a3b8;
      --node-ring: rgba(148, 163, 184, .32);
      background: var(--removed);
      border-color: #9a9a94;
      border-style: dashed;
      opacity: .62;
    }

    .node.risk {
      border-color: var(--risk);
      box-shadow: 0 0 0 3px rgba(239, 68, 68, .12), 0 16px 28px rgba(32, 36, 42, .16);
    }

    .node.manual-color {
      opacity: 1;
    }

    .node.manual-color.risk {
      box-shadow: var(--card-shadow);
    }

    .node.manual-color.palette-core {
      --node-accent: #168fd1;
      --node-ring: rgba(22, 143, 209, .3);
      background: var(--core);
      border-color: #64748b;
    }

    .node.manual-color.palette-external {
      --node-accent: #f59e0b;
      --node-ring: rgba(245, 158, 11, .32);
      background: var(--external);
      border-color: #7d6500;
    }

    .node.manual-color.palette-added {
      --node-accent: #10b981;
      --node-ring: rgba(16, 185, 129, .3);
      background: var(--added);
      border-color: var(--green);
    }

    .node.manual-color.palette-candidate {
      --node-accent: #8b5cf6;
      --node-ring: rgba(139, 92, 246, .32);
