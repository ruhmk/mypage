    async function openRecentDb() {
      if (!("indexedDB" in window)) return null;
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(RECENT_FILE_DB, 1);
        request.onupgradeneeded = () => {
          const db = request.result;
          if (!db.objectStoreNames.contains(RECENT_FILE_STORE)) {
            db.createObjectStore(RECENT_FILE_STORE, { keyPath: "id" });
          }
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    function transactionDone(transaction) {
      return new Promise((resolve, reject) => {
        transaction.oncomplete = () => resolve();
        transaction.onerror = () => reject(transaction.error);
        transaction.onabort = () => reject(transaction.error);
      });
    }

    async function loadRecentFiles() {
      try {
        const db = await openRecentDb();
        if (!db) return [];
        const transaction = db.transaction(RECENT_FILE_STORE, "readonly");
        const request = transaction.objectStore(RECENT_FILE_STORE).getAll();
        const rows = await new Promise((resolve, reject) => {
          request.onsuccess = () => resolve(request.result || []);
          request.onerror = () => reject(request.error);
        });
        db.close();
        return rows
          .filter((entry) => entry && entry.id && entry.handle)
          .sort((a, b) => (b.lastOpened || 0) - (a.lastOpened || 0))
          .slice(0, RECENT_FILE_LIMIT);
      } catch (error) {
        console.warn(error);
        return [];
      }
    }

    async function persistRecentFiles() {
      try {
        const db = await openRecentDb();
        if (!db) return;
        const transaction = db.transaction(RECENT_FILE_STORE, "readwrite");
        const store = transaction.objectStore(RECENT_FILE_STORE);
        store.clear();
        recentFiles.forEach((entry) => store.put(entry));
        await transactionDone(transaction);
        db.close();
      } catch (error) {
        console.warn(error);
      }
    }

    async function sameFileHandle(left, right) {
      if (!left || !right) return false;
      if (left === right) return true;
      if (typeof left.isSameEntry === "function") {
        try {
          return await left.isSameEntry(right);
        } catch (error) {
          console.warn(error);
        }
      }
      return false;
    }

    async function rememberFileHandle(handle) {
      if (!handle) return;
      let existing = null;
      for (const entry of recentFiles) {
        if (await sameFileHandle(entry.handle, handle)) {
          existing = entry;
          break;
        }
      }
      const entry = {
        id: existing?.id || `file-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`,
        name: handle.name || existing?.name || "名称未設定",
        handle,
        lastOpened: Date.now()
      };
      recentFiles = [entry, ...recentFiles.filter((item) => item.id !== entry.id)].slice(0, RECENT_FILE_LIMIT);
      fileHandle = handle;
      currentFileId = entry.id;
      await persistRecentFiles();
      renderRecentFiles();
    }

    async function ensureHandlePermission(handle, mode) {
      if (!handle || typeof handle.queryPermission !== "function" || typeof handle.requestPermission !== "function") return true;
      const options = { mode };
      if (await handle.queryPermission(options) === "granted") return true;
      return await handle.requestPermission(options) === "granted";
    }

    function applyImportedState(parsed) {
      if (!parsed.scenarios || !Array.isArray(parsed.scenarios)) throw new Error("invalid");
      pushHistory();
      state = normalizeState(parsed);
      activeScenarioId = state.scenarios[0].id;
      selectedNodeId = state.scenarios[0].nodes[0]?.id || null;
      selectedKnotId = null;
      selectedZoneId = null;
      autoCenteredScenarioIds.clear();
      render();
    }

    async function loadFromFileHandle(handle, remember = true) {
      if (!handle) return;
      const allowed = await ensureHandlePermission(handle, "read");
      if (!allowed) {
        notify("ファイルを開く権限がありません");
        renderRecentFiles();
        return;
      }
      const file = await handle.getFile();
      const text = await file.text();
      applyImportedState(JSON.parse(text));
      if (remember) await rememberFileHandle(handle);
      notify(`${handle.name || file.name}を開きました`);
    }

    async function openExternalFile() {
      try {
        if ("showOpenFilePicker" in window) {
          const handles = await window.showOpenFilePicker({
            multiple: false,
            types: filePickerTypes()
          });
          await loadFromFileHandle(handles[0], true);
          return;
        }
        fileInputEl.click();
      } catch (error) {
        if (error?.name !== "AbortError") notify("読み込みに失敗しました");
      }
    }

    async function openRecentFile(id) {
      if (!id) {
        currentFileId = null;
        fileHandle = null;
        renderRecentFiles();
        return;
      }
      const entry = recentFiles.find((item) => item.id === id);
      if (!entry?.handle) {
        notify("ファイルを開けませんでした");
        return;
      }
      try {
        await loadFromFileHandle(entry.handle, true);
      } catch (error) {
        if (error?.name !== "AbortError") notify("読み込みに失敗しました");
      }
    }

    async function removeSelectedRecentFile() {
      const id = recentFileSelectEl.value || currentFileId;
      if (!id) return;
      const entry = recentFiles.find((item) => item.id === id);
      recentFiles = recentFiles.filter((item) => item.id !== id);
      if (currentFileId === id) {
        currentFileId = null;
        fileHandle = null;
      }
      await persistRecentFiles();
      renderRecentFiles();
      notify(`${entry?.name || "ファイル"}をプルダウンから外しました`);
    }

    function cloneNodes(nodes) {
      return nodes.map((node) => ({ ...node }));
    }

    function cloneScenarioPayload(scenario) {
      return {
        nodes: cloneNodes(scenario.nodes || []),
        knots: (scenario.knots || []).map((knot) => ({ ...knot })),
        extZone: scenario.extZone ? { ...scenario.extZone } : null,
        extraZones: (scenario.extraZones || []).map((zone) => ({ ...zone })),
        canvasVersion: scenario.canvasVersion || CANVAS.version
      };
    }

    function createDefaultState() {
      return {
        scenarios: [{
          id: "current",
          name: "現行",
          nodes: [],
          knots: [],
          extZone: null,
          extraZones: [],
          canvasVersion: CANVAS.version
        }]
      };
    }

    function normalizeState(input) {
      const normalized = input && Array.isArray(input.scenarios) && input.scenarios.length
        ? input
        : createDefaultState();
      normalized.scenarios.forEach((scenario) => {
        scenario.nodes = cloneNodes(scenario.nodes || []).map((node) => {
          const status = ["removed", "added", "risk"].includes(node.status)
            ? node.status
            : (node.status === "hiring" || node.hiring ? "hiring" : (node.status || "current"));
          const colorOverride = CARD_COLOR_OVERRIDES.includes(node.colorOverride) ? node.colorOverride : null;
          const borderStyleOverride = BORDER_STYLE_OVERRIDES.includes(node.borderStyleOverride) ? node.borderStyleOverride : null;
          return {
            ...node,
            status,
            hiring: status === "hiring",
            colorOverride,
            borderStyleOverride,
            slackEmail: `${node.slackEmail || ""}`.trim(),
            slackUserId: `${node.slackUserId || ""}`.trim(),
            slackAvatar: safeSlackAvatar(node.slackAvatar),
            requirement: node.requirement || ""
          };
        });
        scenario.knots = (scenario.knots || []).map((knot) => ({
          ...knot,
          x: snap(knot.x || 0),
          y: snap(knot.y || 0),
          code: `${knot.code || ""}`.trim(),
          parent: knot.parent || null,
          locked: Boolean(knot.locked),
          lockedLinks: Array.isArray(knot.lockedLinks) ? knot.lockedLinks : []
        }));
        ensureKnotCodes(scenario);
        normalizeNodeParentRefs(scenario);
        if (scenario.extZone) {
          scenario.extZone = {
            label: scenario.extZone.label || "C&R ライン",
            x: snap(scenario.extZone.x || 0),
            y: snap(scenario.extZone.y || 0),
            width: snap(scenario.extZone.width || 0),
            height: snap(scenario.extZone.height || 0),
            locked: Boolean(scenario.extZone.locked)
          };
        }
        scenario.extraZones = (scenario.extraZones || []).map((zone) => ({
          id: zone.id || `zone-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 6)}`,
          label: zone.label || "追加枠",
          x: snap(zone.x || 0),
          y: snap(zone.y || 0),
          width: snap(zone.width || 360),
          height: snap(zone.height || 240),
          locked: Boolean(zone.locked)
        }));
        centerScenarioOnCanvas(scenario);
      });
      return normalized;
    }

    function safeSlackAvatar(value) {
      const avatar = `${value || ""}`;
      return /^data:image\/(png|jpeg|jpg|webp|gif);base64,/i.test(avatar) && avatar.length <= 350000 ? avatar : "";
    }

    function loadState() {
      return createDefaultState();
    }

    function centerScenarioOnCanvas(scenario) {
      if (scenario.canvasVersion === CANVAS.version) return;
      const bounds = scenarioBounds(scenario);
      if (bounds) {
        const centerX = (bounds.minX + bounds.maxX) / 2;
        const centerY = (bounds.minY + bounds.maxY) / 2;
        const looksNearCorner = bounds.minX < CANVAS.originX * .55 || bounds.minY < CANVAS.originY * .55;
        if (looksNearCorner) {
          const dx = snap(CANVAS.centerX - centerX);
          const dy = snap(CANVAS.centerY - centerY);
          shiftScenario(scenario, dx, dy);
        }
      }
      scenario.canvasVersion = CANVAS.version;
    }

    function scenarioBounds(scenario) {
      const points = [];
      (scenario.nodes || []).forEach((node) => {
        if (Number.isFinite(node.x) && Number.isFinite(node.y)) {
          points.push({ x: node.x, y: node.y, width: CARD.width, height: CARD.height });
        }
      });
      (scenario.knots || []).forEach((knot) => {
        if (Number.isFinite(knot.x) && Number.isFinite(knot.y)) {
          points.push({ x: knot.x, y: knot.y, width: KNOT_SIZE, height: KNOT_SIZE });
        }
      });
      if (scenario.extZone && Number.isFinite(scenario.extZone.x) && Number.isFinite(scenario.extZone.y)) {
        points.push({ x: scenario.extZone.x, y: scenario.extZone.y, width: scenario.extZone.width || 0, height: scenario.extZone.height || 0 });
      }
      (scenario.extraZones || []).forEach((zone) => {
        if (Number.isFinite(zone.x) && Number.isFinite(zone.y)) {
          points.push({ x: zone.x, y: zone.y, width: zone.width || 0, height: zone.height || 0 });
        }
      });
      if (!points.length) return null;
      return {
        minX: Math.min(...points.map((point) => point.x)),
        minY: Math.min(...points.map((point) => point.y)),
        maxX: Math.max(...points.map((point) => point.x + point.width)),
        maxY: Math.max(...points.map((point) => point.y + point.height))
      };
    }

    function shiftScenario(scenario, dx, dy) {
      (scenario.nodes || []).forEach((node) => {
        if (!Number.isFinite(node.x) || !Number.isFinite(node.y)) return;
        node.x = Math.max(0, snap(node.x + dx));
        node.y = Math.max(0, snap(node.y + dy));
      });
      (scenario.knots || []).forEach((knot) => {
        if (!Number.isFinite(knot.x) || !Number.isFinite(knot.y)) return;
        knot.x = Math.max(0, snap(knot.x + dx));
        knot.y = Math.max(0, snap(knot.y + dy));
      });
      if (scenario.extZone && Number.isFinite(scenario.extZone.x) && Number.isFinite(scenario.extZone.y)) {
        scenario.extZone.x = Math.max(0, snap(scenario.extZone.x + dx));
        scenario.extZone.y = Math.max(0, snap(scenario.extZone.y + dy));
      }
      (scenario.extraZones || []).forEach((zone) => {
        if (!Number.isFinite(zone.x) || !Number.isFinite(zone.y)) return;
        zone.x = Math.max(0, snap(zone.x + dx));
        zone.y = Math.max(0, snap(zone.y + dy));
      });
    }

    function ensureKnotCodes(scenario) {
      const used = new Set();
      (scenario.knots || []).forEach((knot) => {
        let code = `${knot.code || ""}`.trim().toUpperCase();
        if (!/^K\d+$/.test(code) || used.has(code)) code = nextKnotCodeFromUsed(used);
        knot.code = code;
        used.add(code);
      });
    }

    function nextKnotCode(scenario) {
      const used = new Set((scenario.knots || []).map((knot) => `${knot.code || ""}`.trim().toUpperCase()).filter(Boolean));
      return nextKnotCodeFromUsed(used);
    }

    function nextKnotCodeFromUsed(used) {
      let index = 1;
      while (used.has(`K${index}`)) index += 1;
      return `K${index}`;
    }

    function normalizeNodeParentRefs(scenario) {
      const codeToId = new Map((scenario.knots || []).map((knot) => [knot.code, knot.id]));
      const validIds = new Set([
        ...(scenario.nodes || []).map((node) => node.id),
        ...(scenario.knots || []).map((knot) => knot.id)
      ]);
      (scenario.nodes || []).forEach((node) => {
        if (codeToId.has(node.parent)) node.parent = codeToId.get(node.parent);
        if (node.parent && !validIds.has(node.parent)) node.parent = null;
      });
      (scenario.knots || []).forEach((knot) => {
        if (codeToId.has(knot.parent)) knot.parent = codeToId.get(knot.parent);
        if (knot.parent === knot.id || (knot.parent && !validIds.has(knot.parent))) knot.parent = null;
      });
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function snapshot() {
      return JSON.stringify({ state, activeScenarioId, selectedNodeId, selectedKnotId, selectedZoneId });
    }

    function restoreSnapshot(serialized) {
      const restored = JSON.parse(serialized);
      state = normalizeState(restored.state);
      activeScenarioId = restored.activeScenarioId || state.scenarios[0]?.id;
      selectedNodeId = restored.selectedNodeId || null;
      selectedKnotId = restored.selectedKnotId || null;
      selectedZoneId = restored.selectedZoneId || null;
      if (!state.scenarios.some((scenario) => scenario.id === activeScenarioId)) {
        activeScenarioId = state.scenarios[0]?.id;
      }
      render();
      updateHistoryButtons();
    }

    function pushHistory() {
      const current = snapshot();
      if (undoStack[undoStack.length - 1] === current) return;
      undoStack.push(current);
      if (undoStack.length > HISTORY_LIMIT) undoStack.shift();
      redoStack = [];
      updateHistoryButtons();
    }

    function pushHistorySnapshot(serialized) {
      if (!serialized || serialized === snapshot() || undoStack[undoStack.length - 1] === serialized) return;
      undoStack.push(serialized);
      if (undoStack.length > HISTORY_LIMIT) undoStack.shift();
      redoStack = [];
      updateHistoryButtons();
    }

    function undo() {
      if (!undoStack.length) return;
      redoStack.push(snapshot());
      restoreSnapshot(undoStack.pop());
      notify("Undoしました");
    }

    function redo() {
      if (!redoStack.length) return;
      undoStack.push(snapshot());
      restoreSnapshot(redoStack.pop());
      notify("Redoしました");
    }

    function updateHistoryButtons() {
      document.getElementById("undoBtn").disabled = !undoStack.length;
      document.getElementById("redoBtn").disabled = !redoStack.length;
    }

    function getActiveScenario() {
      return state.scenarios.find((scenario) => scenario.id === activeScenarioId) || state.scenarios[0];
    }

    function getCurrentNodes() {
      return getActiveScenario().nodes;
    }

    function getCurrentKnots() {
      const scenario = getActiveScenario();
      scenario.knots ||= [];
      return scenario.knots;
    }

    function getNode(id) {
      return getCurrentNodes().find((node) => node.id === id);
    }

    function getKnot(id) {
      return getCurrentKnots().find((knot) => knot.id === id);
    }

    function knotDisplayName(knot) {
      return knot?.code || knot?.id || "K?";
    }

    function getLayoutZone(id) {
      return (currentLayout?.zones || []).find((zone) => zone.id === id);
    }

    function zonePayload(zone) {
      return {
        id: zone.id,
        label: zone.label,
        x: snap(zone.x),
        y: snap(zone.y),
        width: snap(zone.width),
        height: snap(zone.height),
        locked: Boolean(zone.locked)
      };
    }

    function saveZoneToScenario(zone) {
      const scenario = getActiveScenario();
      const payload = zonePayload(zone);
      if (zone.id === "external") {
        scenario.extZone = {
          label: payload.label || "C&R ライン",
          x: payload.x,
          y: payload.y,
          width: payload.width,
          height: payload.height,
          locked: payload.locked
        };
        return;
      }
      scenario.extraZones ||= [];
      const index = scenario.extraZones.findIndex((item) => item.id === zone.id);
      if (index >= 0) {
        scenario.extraZones[index] = payload;
      } else {
        scenario.extraZones.push(payload);
      }
    }

    function baseMap() {
      const current = state.scenarios.find((scenario) => scenario.id === "current") || state.scenarios[0];
      return new Map(current.nodes.map((node) => [node.id, node]));
    }

    function render() {
      renderTabs();
      const layout = buildLayout(getCurrentNodes());
      saveState();
      renderStats();
      renderBoard(layout);
      actionPulseNodeId = null;
      centerViewportOnContent(layout);
      renderInspector();
      updateHistoryButtons();
    }

    function centerViewportOnContent(layout) {
      if (!layout?.contentBounds || autoCenteredScenarioIds.has(activeScenarioId)) return;
      autoCenteredScenarioIds.add(activeScenarioId);
      requestAnimationFrame(() => {
        const bounds = layout.contentBounds;
        const centerX = (bounds.minX + bounds.maxX) / 2;
        const centerY = (bounds.minY + bounds.maxY) / 2;
        boardScrollEl.scrollLeft = Math.max(0, centerX * viewport.scale - boardScrollEl.clientWidth / 2);
        boardScrollEl.scrollTop = Math.max(0, centerY * viewport.scale - boardScrollEl.clientHeight / 2);
      });
    }

    function renderTabs() {
      tabsEl.innerHTML = "";
      state.scenarios.forEach((scenario) => {
        const item = document.createElement("div");
        item.className = "tab-item";
        const button = document.createElement("button");
        button.className = `tab ${scenario.id === activeScenarioId ? "active" : ""}`;
        button.type = "button";
        button.textContent = scenario.name;
        button.title = "クリックで切替 / ダブルクリックで案名変更";
        button.addEventListener("click", () => {
          activeScenarioId = scenario.id;
          selectedNodeId = scenario.nodes[0]?.id || null;
          selectedKnotId = null;
          selectedZoneId = null;
          render();
        });
        button.addEventListener("dblclick", (event) => {
          event.preventDefault();
          renameScenario(scenario.id);
        });

        const actions = document.createElement("div");
        actions.className = "tab-actions";
        const duplicateButton = document.createElement("button");
        duplicateButton.className = "tab-mini";
        duplicateButton.type = "button";
        duplicateButton.textContent = "+";
        duplicateButton.title = "この案を複製";
        duplicateButton.setAttribute("aria-label", "この案を複製");
        duplicateButton.addEventListener("click", (event) => {
          event.preventDefault();
          event.stopPropagation();
          duplicateScenario(scenario.id);
        });
        const deleteButton = document.createElement("button");
        deleteButton.className = "tab-mini delete";
        deleteButton.type = "button";
        deleteButton.textContent = "-";
        deleteButton.title = state.scenarios.length <= 1 ? "最後の案は削除できません" : "この案を削除";
        deleteButton.setAttribute("aria-label", "この案を削除");
        deleteButton.disabled = state.scenarios.length <= 1;
        deleteButton.addEventListener("click", (event) => {
          event.preventDefault();
          event.stopPropagation();
          deleteScenario(scenario.id);
        });
        actions.append(duplicateButton, deleteButton);
        item.append(button, actions);
        tabsEl.appendChild(item);
      });
    }

    function buildLayout(nodes) {
      const scenario = getActiveScenario();
      const nodeMap = new Map(nodes.map((node) => [node.id, node]));
      const childrenMap = new Map();
      nodes.forEach((node) => childrenMap.set(node.id, []));
      nodes.forEach((node) => {
        if (node.parent && nodeMap.has(node.parent) && node.parent !== node.id) {
          childrenMap.get(node.parent).push(node);
        }
      });
      childrenMap.forEach((children) => {
        children.sort((a, b) => laneSort(a) - laneSort(b) || a.role.localeCompare(b.role, "ja") || a.name.localeCompare(b.name, "ja"));
      });

      const roots = nodes
        .filter((node) => !node.parent || !nodeMap.has(node.parent) || node.parent === node.id)
        .sort((a, b) => laneSort(a) - laneSort(b));

      const positions = new Map();
      const subtreeWidth = new Map();
      const levels = new Map();
      let maxDepth = 0;

      function measure(node, depth) {
        maxDepth = Math.max(maxDepth, depth);
        levels.set(node.id, depth);
        const children = childrenMap.get(node.id) || [];
        if (!children.length) {
          subtreeWidth.set(node.id, CARD.width);
          return CARD.width;
        }
        const width = children.reduce((sum, child) => sum + measure(child, depth + 1), 0) + CARD.gapX * (children.length - 1);
        subtreeWidth.set(node.id, Math.max(CARD.width, width));
        return subtreeWidth.get(node.id);
      }

      roots.forEach((root) => measure(root, 0));

      let cursorX = CARD.left;
      function place(node, depth, left) {
        const width = subtreeWidth.get(node.id) || CARD.width;
        const x = left + width / 2 - CARD.width / 2;
        const y = CARD.top + depth * CARD.gapY + (node.lane === "external" ? 42 : 0);
        positions.set(node.id, { x, y, width: CARD.width, height: CARD.height, depth });
        const children = childrenMap.get(node.id) || [];
        let childLeft = left;
        children.forEach((child) => {
          place(child, depth + 1, childLeft);
          childLeft += (subtreeWidth.get(child.id) || CARD.width) + CARD.gapX;
        });
      }

      roots.forEach((root) => {
        place(root, 0, cursorX);
        cursorX += (subtreeWidth.get(root.id) || CARD.width) + CARD.gapX * 1.7;
      });

      positions.forEach((pos, id) => {
        const node = nodeMap.get(id);
        if (!node) return;
        if (Number.isFinite(node.x) && Number.isFinite(node.y)) {
          pos.x = snap(node.x);
          pos.y = snap(node.y);
        } else {
          node.x = snap(pos.x);
          node.y = snap(pos.y);
          pos.x = node.x;
          pos.y = node.y;
        }
      });

      const extPositions = [...positions.entries()]
        .filter(([id]) => nodeMap.get(id)?.lane === "external")
        .map(([, pos]) => pos);

      let extZone = extPositions.length ? {
        x: snap(Math.max(18, Math.min(...extPositions.map((pos) => pos.x)) - 34)),
        y: snap(Math.max(120, Math.min(...extPositions.map((pos) => pos.y)) - 42)),
        width: snap(Math.max(...extPositions.map((pos) => pos.x + pos.width)) - Math.min(...extPositions.map((pos) => pos.x)) + 68),
        height: snap(Math.max(...extPositions.map((pos) => pos.y + pos.height)) - Math.min(...extPositions.map((pos) => pos.y)) + 76)
      } : null;
      if (extZone && scenario.extZone) {
        extZone = { ...extZone, ...scenario.extZone };
      } else if (extZone) {
        scenario.extZone = { ...extZone };
      }
      if (extZone) {
        extZone.x = snap(extZone.x);
        extZone.y = snap(extZone.y);
        extZone.width = snap(extZone.width);
        extZone.height = snap(extZone.height);
        extZone = { ...extZone, id: "external", label: extZone.label || "C&R ライン", locked: Boolean(extZone.locked) };
        scenario.extZone = {
          label: extZone.label,
          x: extZone.x,
          y: extZone.y,
          width: extZone.width,
          height: extZone.height,
          locked: extZone.locked
        };
      }

      scenario.extraZones ||= [];
      const extraZones = scenario.extraZones.map((zone) => ({
        id: zone.id || `zone-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 6)}`,
        label: zone.label || "追加枠",
        x: snap(zone.x || 0),
        y: snap(zone.y || 0),
        width: snap(clamp(zone.width || 360, 260, 2400)),
        height: snap(clamp(zone.height || 240, 180, 1800)),
        locked: Boolean(zone.locked)
      }));
      scenario.extraZones = extraZones.map(zonePayload);
      const zones = extZone ? [extZone, ...extraZones] : extraZones;
      const knots = scenario.knots || [];
      const positioned = [...positions.values()];
      const contentBounds = layoutContentBounds(positioned, knots, zones);
      const boardWidth = Math.max(CANVAS.width, 1060, ...positioned.map((pos) => pos.x + pos.width + BOARD_MARGIN.right), ...knots.map((knot) => knot.x + BOARD_MARGIN.right), ...zones.map((zone) => zone.x + zone.width + BOARD_MARGIN.right));
      const boardHeight = Math.max(CANVAS.height, 1040, ...positioned.map((pos) => pos.y + pos.height + BOARD_MARGIN.bottom), ...knots.map((knot) => knot.y + BOARD_MARGIN.bottom), ...zones.map((zone) => zone.y + zone.height + BOARD_MARGIN.bottom));

      return { nodes, nodeMap, childrenMap, positions, knots, extZone, zones, contentBounds, boardWidth, boardHeight };
    }

    function layoutContentBounds(positions, knots, zones) {
      const items = [
        ...positions.map((pos) => ({ x: pos.x, y: pos.y, width: pos.width, height: pos.height })),
        ...knots.map((knot) => ({ x: knot.x - KNOT_SIZE / 2, y: knot.y - KNOT_SIZE / 2, width: KNOT_SIZE, height: KNOT_SIZE })),
        ...zones.map((zone) => ({ x: zone.x, y: zone.y, width: zone.width, height: zone.height }))
      ].filter((item) => Number.isFinite(item.x) && Number.isFinite(item.y));
      if (!items.length) {
        return { minX: CANVAS.centerX, minY: CANVAS.centerY, maxX: CANVAS.centerX, maxY: CANVAS.centerY };
      }
      return {
        minX: Math.min(...items.map((item) => item.x)),
        minY: Math.min(...items.map((item) => item.y)),
        maxX: Math.max(...items.map((item) => item.x + item.width)),
        maxY: Math.max(...items.map((item) => item.y + item.height))
      };
    }

    function laneSort(node) {
      if (node.id === "kitagawa") return 0;
      if (node.lane === "core") return 1;
      if (node.lane === "external") return 2;
      return 3;
    }

    function nodeDisplayName(node) {
      if (node.hiring && (!node.name || node.name === "未定")) return "採用枠";
      return node.name || "未定";
    }

    function nodeMetaHtml(node) {
      const requirementLabel = node.requirement ? "要件あり" : (node.hiring ? "採用" : "");
      return `
        ${node.team ? `<span class="pill">${escapeHtml(node.team)}</span>` : ""}
        ${requirementLabel ? `<span class="pill requirement">${requirementLabel}</span>` : ""}
        ${diffLabel(node) ? `<span class="pill diff">${diffLabel(node)}</span>` : ""}
      `;
    }

    function nodeAvatarHtml(node) {
      if (node.slackAvatar) return `<img class="node-avatar" src="${escapeAttr(node.slackAvatar)}" alt="">`;
      return `<span class="node-avatar default-avatar" aria-hidden="true"></span>`;
    }

    function renderBoard(layout) {
      cancelScheduledLinkDraw();
      currentLayout = layout;
      nodeElements = new Map();
      knotElements = new Map();
      boardEl.style.width = `${layout.boardWidth}px`;
      boardEl.style.height = `${layout.boardHeight}px`;
      applyZoom();
      boardEl.querySelectorAll(".node,.zone,.knot,.knot-label").forEach((el) => el.remove());
      linksEl.setAttribute("width", layout.boardWidth);
      linksEl.setAttribute("height", layout.boardHeight);
      linksEl.setAttribute("viewBox", `0 0 ${layout.boardWidth} ${layout.boardHeight}`);
      drawLinks(layout);

      (layout.zones || []).forEach((zoneConfig) => {
        const zone = document.createElement("div");
        zone.className = `zone ${selectedZoneId === zoneConfig.id ? "selected" : ""} ${zoneConfig.locked ? "locked" : ""}`;
        zone.style.left = `${zoneConfig.x}px`;
        zone.style.top = `${zoneConfig.y}px`;
        zone.style.width = `${zoneConfig.width}px`;
        zone.style.height = `${zoneConfig.height}px`;
        zone.dataset.zoneId = zoneConfig.id;
        zone.innerHTML = `
          <div class="zone-label">${escapeHtml(zoneConfig.label || "追加枠")}</div>
          <button class="zone-lock" type="button" title="${zoneConfig.locked ? "位置ロックを解除" : "位置をロック"}" aria-label="${zoneConfig.locked ? "位置ロックを解除" : "位置をロック"}">${zoneConfig.locked ? "&#128275;" : "&#128274;"}</button>
          <div class="zone-handle e" data-resize="e" title="横幅を変更"></div>
          <div class="zone-handle s" data-resize="s" title="高さを変更"></div>
          <div class="zone-handle se" data-resize="se" title="サイズを変更"></div>
        `;
        zone.addEventListener("pointerdown", startZonePointer);
        zone.querySelector(".zone-lock").addEventListener("pointerdown", (event) => {
          event.stopPropagation();
        });
        zone.querySelector(".zone-lock").addEventListener("click", (event) => {
          event.preventDefault();
          event.stopPropagation();
          toggleZoneLock(zoneConfig.id);
        });
        zone.querySelectorAll(".zone-handle").forEach((handle) => {
          handle.addEventListener("pointerdown", startZoneResizePointer);
        });
        boardEl.appendChild(zone);
      });

      layout.knots.forEach((knot) => {
        const knotEl = document.createElement("button");
        knotEl.type = "button";
        knotEl.className = `knot ${selectedKnotId === knot.id ? "selected" : ""} ${knot.locked ? "locked" : ""}`;
        knotEl.style.left = `${knot.x - KNOT_SIZE / 2}px`;
        knotEl.style.top = `${knot.y - KNOT_SIZE / 2}px`;
        knotEl.dataset.knotId = knot.id;
        knotEl.title = `${knotDisplayName(knot)} / 線ノット`;
        knotEl.setAttribute("aria-label", `${knotDisplayName(knot)} / 線ノット`);
        knotEl.addEventListener("pointerdown", startKnotPointer);
        boardEl.appendChild(knotEl);
        knotElements.set(knot.id, knotEl);
        const labelEl = document.createElement("div");
        labelEl.className = "knot-label";
        labelEl.dataset.knotLabelId = knot.id;
        labelEl.style.left = `${knot.x + 12}px`;
        labelEl.style.top = `${knot.y - 18}px`;
        labelEl.textContent = knotDisplayName(knot);
        boardEl.appendChild(labelEl);
      });

      layout.nodes.forEach((node) => {
        const pos = layout.positions.get(node.id);
        if (!pos) return;
        const nodeEl = document.createElement("button");
        nodeEl.type = "button";
        nodeEl.className = buildNodeClass(node, layout.nodeMap);
        nodeEl.style.left = `${pos.x}px`;
        nodeEl.style.top = `${pos.y}px`;
        applyCardFloatPhase(nodeEl, node);
        nodeEl.setAttribute("data-node-id", node.id);
        nodeEl.title = `${node.role} / ${nodeDisplayName(node)}`;
        nodeEl.innerHTML = `
          ${nodeAvatarHtml(node)}
          <div class="node-copy">
            <div class="role">${escapeHtml(node.role || "役割未設定")}</div>
            <div class="person">${escapeHtml(nodeDisplayName(node))}</div>
            <div class="meta">${nodeMetaHtml(node)}</div>
          </div>
        `;
        nodeEl.addEventListener("pointerdown", startNodePointer);
        nodeEl.addEventListener("dblclick", startNodeEdit);
        boardEl.appendChild(nodeEl);
        fitPersonName(nodeEl);
        nodeElements.set(node.id, nodeEl);
      });
    }

    function drawLinks(layout, options = {}) {
      const renderHandles = options.renderHandles !== false;
      linksEl.innerHTML = "";
      const knotParentRoutes = buildKnotParentRoutes(layout);
      knotParentRoutes.forEach((route) => {
        appendLinkPath(
          directPath(route.source.x, route.source.y, route.target.x, route.target.y),
          false,
          renderHandles ? knotParentConnector(route) : null
        );
      });
      const routes = buildLinkRoutes(layout);

      const grouped = new Map();
      routes.forEach((route) => {
        if (!route.knot) return;
        const key = `${route.knot.id}|${route.parentId}`;
        if (!grouped.has(key)) grouped.set(key, []);
        grouped.get(key).push(route);
      });
      const groupedRouteIds = new Set();
      grouped.forEach((group) => {
        if (group.length < 2) return;
        const first = group[0];
        const parentSource = anchorEdgePoint(first.parentAnchor, { x: first.knot.x, y: first.knot.y });
        appendLinkPath(directPath(parentSource.x, parentSource.y, first.knot.x, first.knot.y), group.every((route) => route.removed));
        group.forEach((route) => {
          groupedRouteIds.add(route.linkId);
          const source = { x: route.knot.x, y: route.knot.y };
          appendLinkPath(
            directPath(source.x, source.y, route.target.x, route.target.y),
            route.removed,
            renderHandles ? nodeRouteConnector(route, source, route.target) : null
          );
        });
      });

      routes.forEach((route) => {
        if (!groupedRouteIds.has(route.linkId)) {
          appendLinkPath(
            route.knot
              ? knotPath(route.source.x, route.source.y, route.knot.x, route.knot.y, route.target.x, route.target.y)
              : directPath(route.source.x, route.source.y, route.target.x, route.target.y),
            route.removed,
            renderHandles ? nodeRouteConnector(route, route.source, route.target) : null
          );
        }
      });
    }

    function nodeRouteConnector(route, source, target) {
      return {
        type: "node",
        linkId: route.linkId,
        nodeId: route.node.id,
        parentId: route.parentId,
        source,
        target,
        locked: Boolean(route.knot?.locked || (route.parentAnchor.type === "knot" && route.parentAnchor.knot.locked))
      };
    }

    function knotParentConnector(route) {
      return {
        type: "knot-parent",
        connectorKind: "parent",
        knotId: route.knot.id,
        linkId: route.linkId,
        nodeId: route.knot.id,
        parentId: route.parentId,
        source: route.source,
        target: route.target,
        locked: Boolean(route.knot.locked || (route.parentAnchor.type === "knot" && route.parentAnchor.knot.locked))
      };
    }

    function appendLinkPath(d, removed = false, connector = null) {
      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path.setAttribute("class", `link${removed ? " removed" : ""}`);
      path.setAttribute("d", d);
      if (removed) {
        path.setAttribute("stroke-dasharray", "7 6");
        path.setAttribute("opacity", ".55");
      }
      linksEl.appendChild(path);
      if (connector) appendInteractiveLinkHit(d, connector);
    }

    function appendInteractiveLinkHit(d, connector) {
      const hitPath = document.createElementNS("http://www.w3.org/2000/svg", "path");
      hitPath.setAttribute("class", `link-hit${connector.locked ? " locked" : ""}`);
      hitPath.setAttribute("d", d);
      hitPath.dataset.linkId = connector.linkId;
      hitPath.dataset.nodeId = connector.nodeId;
      hitPath.dataset.parentId = connector.parentId;
      if (connector.knotId) hitPath.dataset.knotId = connector.knotId;
      if (connector.connectorKind) hitPath.dataset.connectorKind = connector.connectorKind;

      const dot = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      dot.setAttribute("r", "7.5");
      dot.setAttribute("class", `link-hover-dot source${connector.locked ? " locked" : ""}`);
      hitPath.hoverDot = dot;

      const positionDot = (event) => {
        const nearest = closestPointOnSvgPath(hitPath, clientToBoardPoint(event.clientX, event.clientY));
        const endpoint = nearest.length <= nearest.totalLength / 2 ? "source" : "target";
        const opposite = endpoint === "source" ? connector.target : connector.source;
        dot.setAttribute("cx", nearest.x);
        dot.setAttribute("cy", nearest.y);
        dot.classList.toggle("source", endpoint === "source");
        dot.classList.toggle("target", endpoint === "target");
        dot.classList.add("visible");
        hitPath.dataset.endpoint = endpoint;
        hitPath.dataset.oppositeX = opposite.x;
        hitPath.dataset.oppositeY = opposite.y;
        hitPath.setAttribute("aria-label", connector.locked
          ? "ロック中の接続線"
          : (endpoint === "source" ? "親側の接続先を変更" : "子側の接続先を変更"));
      };

      hitPath.addEventListener("pointermove", (event) => {
        if (!interaction) positionDot(event);
      });
      hitPath.addEventListener("pointerleave", () => {
        if (!interaction) dot.classList.remove("visible");
      });
      hitPath.addEventListener("pointerdown", (event) => {
        positionDot(event);
        if (connector.locked) return;
        if (connector.type === "knot-parent") {
          startKnotConnectorPointer(event);
        } else {
          startConnectorPointer(event);
        }
      });
      linksEl.appendChild(hitPath);
      linksEl.appendChild(dot);
    }

    function closestPointOnSvgPath(path, point) {
      const totalLength = Math.max(0, path.getTotalLength());
      if (!totalLength) return { x: point.x, y: point.y, length: 0, totalLength: 0 };
      const sampleCount = clamp(Math.ceil(totalLength / 64), 10, 28);
      let bestLength = 0;
      let bestPoint = path.getPointAtLength(0);
      let bestDistance = Infinity;
      const consider = (length) => {
        const boundedLength = clamp(length, 0, totalLength);
        const sample = path.getPointAtLength(boundedLength);
        const distance = (sample.x - point.x) ** 2 + (sample.y - point.y) ** 2;
        if (distance < bestDistance) {
          bestDistance = distance;
          bestLength = boundedLength;
          bestPoint = sample;
        }
      };
      for (let index = 0; index <= sampleCount; index += 1) {
        consider(totalLength * index / sampleCount);
      }
      let radius = totalLength / sampleCount;
      for (let pass = 0; pass < 3; pass += 1) {
        const step = radius / 4;
        for (let offset = -4; offset <= 4; offset += 1) {
          consider(bestLength + step * offset);
        }
        radius = step;
      }
      return { x: bestPoint.x, y: bestPoint.y, length: bestLength, totalLength };
    }

    function scheduleLightweightLinkDraw(layout) {
      if (linkDrawFrame !== null) return;
      linkDrawFrame = requestAnimationFrame(() => {
        linkDrawFrame = null;
        drawLinks(layout, { renderHandles: false });
      });
    }

    function cancelScheduledLinkDraw() {
      if (linkDrawFrame === null) return;
      cancelAnimationFrame(linkDrawFrame);
      linkDrawFrame = null;
    }

    function directPath(x1, y1, x2, y2) {
      const bend = Math.max(56, Math.abs(x2 - x1) * .45);
      const direction = x2 >= x1 ? 1 : -1;
      return `M ${x1} ${y1} C ${x1 + bend * direction} ${y1}, ${x2 - bend * direction} ${y2}, ${x2} ${y2}`;
    }

    function edgePoint(rect, toward) {
      const cx = rect.x + rect.width / 2;
      const cy = rect.y + rect.height / 2;
      const dx = toward.x - cx;
      const dy = toward.y - cy;
      if (Math.abs(dx) / rect.width > Math.abs(dy) / rect.height) {
        return { x: cx + Math.sign(dx || 1) * rect.width / 2, y: cy + dy * (rect.width / 2) / Math.max(1, Math.abs(dx)) };
      }
      return { x: cx + dx * (rect.height / 2) / Math.max(1, Math.abs(dy)), y: cy + Math.sign(dy || 1) * rect.height / 2 };
    }

    function getParentAnchor(layout, parentId) {
      const pos = layout.positions.get(parentId);
      if (pos) return { id: parentId, type: "node", rect: pos };
      const knot = (layout.knots || []).find((item) => item.id === parentId);
      if (knot) return { id: parentId, type: "knot", knot };
      return null;
    }

    function anchorCenter(anchor) {
      if (anchor.type === "knot") return { x: anchor.knot.x, y: anchor.knot.y };
      return { x: anchor.rect.x + anchor.rect.width / 2, y: anchor.rect.y + anchor.rect.height / 2 };
    }

    function anchorEdgePoint(anchor, toward) {
      if (anchor.type === "knot") return anchorCenter(anchor);
      return edgePoint(anchor.rect, toward);
    }

    function knotPath(x1, y1, kx, ky, x2, y2) {
      const bendA = Math.max(36, Math.abs(kx - x1) * .34);
      const bendB = Math.max(36, Math.abs(x2 - kx) * .34);
      const dirA = kx >= x1 ? 1 : -1;
      const dirB = x2 >= kx ? 1 : -1;
      return `M ${x1} ${y1} C ${x1 + bendA * dirA} ${y1}, ${kx - bendA * dirA} ${ky}, ${kx} ${ky} C ${kx + bendB * dirB} ${ky}, ${x2 - bendB * dirB} ${y2}, ${x2} ${y2}`;
    }

    function findRouteKnot(start, end, knots, linkId, excludeIds = []) {
      const excluded = excludeIds instanceof Set ? excludeIds : new Set(excludeIds.filter(Boolean));
      const locked = knots.find((knot) => !excluded.has(knot.id) && knot.locked && (knot.lockedLinks || []).includes(linkId));
      if (locked) return locked;
      let best = null;
      let bestDistance = Infinity;
      knots.forEach((knot) => {
        if (excluded.has(knot.id)) return;
        if (knot.locked) return;
        const distance = distanceToSegment(knot, start, end);
        if (distance < KNOT_CAPTURE_DISTANCE && distance < bestDistance) {
          best = knot;
          bestDistance = distance;
        }
      });
      return best;
    }

    function distanceToSegment(point, start, end) {
      const dx = end.x - start.x;
      const dy = end.y - start.y;
      if (dx === 0 && dy === 0) return Math.hypot(point.x - start.x, point.y - start.y);
      const t = clamp(((point.x - start.x) * dx + (point.y - start.y) * dy) / (dx * dx + dy * dy), 0, 1);
      return Math.hypot(point.x - (start.x + t * dx), point.y - (start.y + t * dy));
    }

    function linkIdFor(node) {
      return `${node.parent}->${node.id}`;
    }

    function startBoardPointer(event) {
      if (event.button === 1) {
        event.preventDefault();
        interaction = {
          type: "zoom",
          pointerId: event.pointerId,
          startY: event.clientY,
          startScale: viewport.scale,
          centerX: event.clientX,
          centerY: event.clientY
        };
        boardScrollEl.classList.add("zooming");
        capturePointer(event.pointerId);
      }
      if (event.target.closest(".node")) return;
      if (event.button === 0) {
        event.preventDefault();
        interaction = {
          type: "pan",
          pointerId: event.pointerId,
          startX: event.clientX,
          startY: event.clientY,
          scrollLeft: boardScrollEl.scrollLeft,
          scrollTop: boardScrollEl.scrollTop
        };
        boardScrollEl.classList.add("panning");
        capturePointer(event.pointerId);
      }
    }

    function startNodePointer(event) {
      if (event.button !== 0 && event.button !== 2) return;
      event.preventDefault();
      event.stopPropagation();
      const nodeId = event.currentTarget.dataset.nodeId;
      const node = getNode(nodeId);
      const pos = currentLayout?.positions.get(nodeId);
      if (!node || !pos) return;
      selectedNodeId = nodeId;
      selectedKnotId = null;
      selectedZoneId = null;
      setSelectedNodeClass(nodeId);
      setSelectedKnotClass(null);
      setSelectedZoneClass(null);
      renderInspector();
      if (event.button === 2) {
        const pointer = clientToBoardPoint(event.clientX, event.clientY);
        const draftStart = edgePoint(pos, pointer);
        interaction = {
          type: "new-connector",
          pointerId: event.pointerId,
          nodeId,
          targetId: null,
          targetKnotId: null,
          draftStart,
          moved: false
        };
        startConnectorDraft(draftStart, pointer);
        capturePointer(event.pointerId);
        return;
      }
      interaction = {
        type: "node",
        pointerId: event.pointerId,
        nodeId,
        startX: event.clientX,
        startY: event.clientY,
        nodeX: pos.x,
        nodeY: pos.y,
        moved: false,
        targetId: null
      };
      event.currentTarget.classList.add("dragging");
      capturePointer(event.pointerId);
    }

    function startNodeEdit(event) {
      event.preventDefault();
      event.stopPropagation();
      const nodeId = event.currentTarget.dataset.nodeId;
      if (!getNode(nodeId)) return;
      selectedNodeId = nodeId;
      selectedKnotId = null;
      selectedZoneId = null;
      setSelectedNodeClass(nodeId);
      setSelectedKnotClass(null);
      setSelectedZoneClass(null);
      renderInspector();
      focusPersonEditor();
    }

    function startKnotPointer(event) {
      if (event.button !== 0) return;
      event.preventDefault();
      event.stopPropagation();
      const knotId = event.currentTarget.dataset.knotId;
      const knot = getKnot(knotId);
      if (!knot) return;
      selectedNodeId = null;
      selectedKnotId = knotId;
      selectedZoneId = null;
      setSelectedNodeClass(null);
      setSelectedKnotClass(knotId);
      setSelectedZoneClass(null);
      renderInspector();
      interaction = {
        type: "knot",
        pointerId: event.pointerId,
        knotId,
        startX: event.clientX,
        startY: event.clientY,
        knotX: knot.x,
        knotY: knot.y,
        moved: false
      };
      event.currentTarget.classList.add("dragging");
      capturePointer(event.pointerId);
    }

    function startConnectorPointer(event) {
      if (event.button !== 0) return;
      event.preventDefault();
      event.stopPropagation();
      const handle = event.currentTarget;
      if (handle.classList.contains("locked")) return;
      const draftStart = { x: Number(handle.dataset.oppositeX), y: Number(handle.dataset.oppositeY) };
      interaction = {
        type: "connector",
        pointerId: event.pointerId,
        endpoint: handle.dataset.endpoint,
        linkId: handle.dataset.linkId,
        nodeId: handle.dataset.nodeId,
        parentId: handle.dataset.parentId,
        targetId: null,
        targetKnotId: null,
        draftStart,
        moved: false
      };
      handle.classList.add("dragging");
      handle.hoverDot?.classList.add("dragging");
      selectedNodeId = handle.dataset.nodeId;
      selectedKnotId = null;
      selectedZoneId = null;
      setSelectedNodeClass(selectedNodeId);
      renderInspector();
      startConnectorDraft(draftStart, clientToBoardPoint(event.clientX, event.clientY));
      capturePointer(event.pointerId);
    }

    function startKnotConnectorPointer(event) {
      if (event.button !== 0) return;
      const handle = event.currentTarget;
      const knot = getKnot(handle.dataset.knotId);
      if (!knot || knot.locked || handle.classList.contains("locked")) return;
      event.preventDefault();
      event.stopPropagation();
      const connectorKind = handle.dataset.connectorKind;
      const draftStart = { x: Number(handle.dataset.oppositeX), y: Number(handle.dataset.oppositeY) };
      interaction = {
        type: "knot-connector",
        pointerId: event.pointerId,
        connectorKind,
        endpoint: handle.dataset.endpoint,
        knotId: knot.id,
        linkId: handle.dataset.linkId,
        nodeId: handle.dataset.nodeId,
        parentId: handle.dataset.parentId,
        targetId: null,
        targetKnotId: null,
        draftStart,
        moved: false
      };
      handle.classList.add("dragging");
      handle.hoverDot?.classList.add("dragging");
      selectedNodeId = connectorKind === "branch" ? handle.dataset.nodeId : null;
      selectedKnotId = connectorKind === "parent" ? knot.id : null;
      selectedZoneId = null;
      setSelectedNodeClass(selectedNodeId);
      setSelectedKnotClass(selectedKnotId);
      setSelectedZoneClass(null);
      renderInspector();
      startConnectorDraft(draftStart, clientToBoardPoint(event.clientX, event.clientY));
      capturePointer(event.pointerId);
    }

    function startConnectorDraft(start, end) {
      clearConnectorDraft();
      connectorDraftEl = document.createElementNS("http://www.w3.org/2000/svg", "path");
      connectorDraftEl.setAttribute("class", "link-draft");
      linksEl.appendChild(connectorDraftEl);
      updateConnectorDraft(start, end);
    }

    function updateConnectorDraft(start, end) {
      if (!connectorDraftEl) return;
      connectorDraftEl.setAttribute("d", directPath(start.x, start.y, end.x, end.y));
    }

    function clearConnectorDraft() {
      connectorDraftEl?.remove();
      connectorDraftEl = null;
    }

    function startZonePointer(event) {
      if (event.button !== 0) return;
      if (event.target.closest(".zone-handle")) return;
      const zoneEl = event.currentTarget;
      const zone = getLayoutZone(zoneEl.dataset.zoneId);
      if (!zone) return;
      if (zone.locked) return;
      event.preventDefault();
      event.stopPropagation();
      selectedNodeId = null;
      selectedKnotId = null;
      selectedZoneId = zone.id;
      setSelectedNodeClass(null);
      setSelectedKnotClass(null);
      setSelectedZoneClass(zone.id);
      renderInspector();
      const childStarts = currentLayout.nodes
        .filter((node) => {
          const pos = currentLayout.positions.get(node.id);
          if (!pos) return false;
          const centerX = pos.x + pos.width / 2;
          const centerY = pos.y + pos.height / 2;
          return centerX >= zone.x && centerX <= zone.x + zone.width && centerY >= zone.y && centerY <= zone.y + zone.height;
        })
        .map((node) => {
          const pos = currentLayout.positions.get(node.id);
          return { id: node.id, x: pos.x, y: pos.y };
        });
      const knotStarts = (currentLayout.knots || [])
        .filter((knot) => knot.x >= zone.x && knot.x <= zone.x + zone.width && knot.y >= zone.y && knot.y <= zone.y + zone.height)
        .map((knot) => ({ id: knot.id, x: knot.x, y: knot.y }));
      interaction = {
        type: "zone",
        pointerId: event.pointerId,
        zoneId: zone.id,
        startX: event.clientX,
        startY: event.clientY,
        zoneX: zone.x,
        zoneY: zone.y,
        childStarts,
        knotStarts,
        moved: false
      };
      zoneEl.classList.add("dragging");
      capturePointer(event.pointerId);
    }

    function startZoneResizePointer(event) {
      if (event.button !== 0) return;
      event.preventDefault();
      event.stopPropagation();
      const zoneEl = event.currentTarget.closest(".zone");
      const zone = getLayoutZone(zoneEl?.dataset.zoneId);
      if (!zone || zone.locked) return;
      selectedNodeId = null;
      selectedKnotId = null;
      selectedZoneId = zone.id;
      setSelectedNodeClass(null);
      setSelectedKnotClass(null);
      setSelectedZoneClass(zone.id);
      renderInspector();
      interaction = {
        type: "zone-resize",
        pointerId: event.pointerId,
        zoneId: zone.id,
        direction: event.currentTarget.dataset.resize,
        startX: event.clientX,
        startY: event.clientY,
        zoneWidth: zone.width,
        zoneHeight: zone.height,
        moved: false
      };
      zoneEl?.classList.add("dragging");
      capturePointer(event.pointerId);
    }

    function movePointer(event) {
      if (!interaction) {
        updateConnectorHandleVisibility(event);
        return;
      }
      if (event.pointerId !== interaction.pointerId) return;
      if (interaction.type === "pan") {
        event.preventDefault();
        boardScrollEl.scrollLeft = interaction.scrollLeft - (event.clientX - interaction.startX);
        boardScrollEl.scrollTop = interaction.scrollTop - (event.clientY - interaction.startY);
        return;
      }
      if (interaction.type === "zoom") {
        event.preventDefault();
        const delta = interaction.startY - event.clientY;
        const nextScale = interaction.startScale * Math.exp(delta / 280);
        setScale(nextScale, interaction.centerX, interaction.centerY);
        return;
      }
      if (interaction.type === "node") {
        event.preventDefault();
        const node = getNode(interaction.nodeId);
        const pos = currentLayout?.positions.get(interaction.nodeId);
        const el = nodeElements.get(interaction.nodeId);
        if (!node || !pos || !el) return;
        const dx = (event.clientX - interaction.startX) / viewport.scale;
        const dy = (event.clientY - interaction.startY) / viewport.scale;
        if (Math.abs(dx) > 3 || Math.abs(dy) > 3) interaction.moved = true;
        if (interaction.moved) ensureInteractionHistory();
        const x = Math.max(0, snap(interaction.nodeX + dx));
        const y = Math.max(0, snap(interaction.nodeY + dy));
        node.x = x;
        node.y = y;
        pos.x = x;
        pos.y = y;
        el.style.left = `${x}px`;
        el.style.top = `${y}px`;
        syncBoardSize(currentLayout);
        updateDropTarget(event);
        scheduleLightweightLinkDraw(currentLayout);
      }
      if (interaction.type === "knot") {
        event.preventDefault();
        const knot = getKnot(interaction.knotId);
        const el = knotElements.get(interaction.knotId);
        if (!knot || !el) return;
        const dx = (event.clientX - interaction.startX) / viewport.scale;
        const dy = (event.clientY - interaction.startY) / viewport.scale;
        if (Math.abs(dx) > 3 || Math.abs(dy) > 3) interaction.moved = true;
        if (interaction.moved) ensureInteractionHistory();
        knot.x = Math.max(0, snap(interaction.knotX + dx));
        knot.y = Math.max(0, snap(interaction.knotY + dy));
        el.style.left = `${knot.x - KNOT_SIZE / 2}px`;
        el.style.top = `${knot.y - KNOT_SIZE / 2}px`;
        const labelEl = boardEl.querySelector(`.knot-label[data-knot-label-id="${interaction.knotId}"]`);
        if (labelEl) {
          labelEl.style.left = `${knot.x + 12}px`;
          labelEl.style.top = `${knot.y - 18}px`;
        }
        syncBoardSize(currentLayout);
        scheduleLightweightLinkDraw(currentLayout);
      }
      if (interaction.type === "zone") {
        event.preventDefault();
        const zone = getLayoutZone(interaction.zoneId);
        const zoneEl = boardEl.querySelector(`.zone[data-zone-id="${interaction.zoneId}"]`);
        if (!zone || !zoneEl) return;
        const dx = (event.clientX - interaction.startX) / viewport.scale;
        const dy = (event.clientY - interaction.startY) / viewport.scale;
        if (Math.abs(dx) > 3 || Math.abs(dy) > 3) interaction.moved = true;
        ensureInteractionHistory();
        const x = Math.max(0, snap(interaction.zoneX + dx));
        const y = Math.max(0, snap(interaction.zoneY + dy));
        zone.x = x;
        zone.y = y;
        saveZoneToScenario(zone);
        zoneEl.style.left = `${x}px`;
        zoneEl.style.top = `${y}px`;
        interaction.childStarts.forEach((start) => {
          const node = getNode(start.id);
          const pos = currentLayout.positions.get(start.id);
          const el = nodeElements.get(start.id);
          if (!node || !pos || !el) return;
          const nodeX = Math.max(0, snap(start.x + dx));
          const nodeY = Math.max(0, snap(start.y + dy));
          node.x = nodeX;
          node.y = nodeY;
          pos.x = nodeX;
          pos.y = nodeY;
          el.style.left = `${nodeX}px`;
          el.style.top = `${nodeY}px`;
        });
        interaction.knotStarts.forEach((start) => {
          const knot = getKnot(start.id);
          const el = knotElements.get(start.id);
          if (!knot || !el) return;
          knot.x = Math.max(0, snap(start.x + dx));
          knot.y = Math.max(0, snap(start.y + dy));
          el.style.left = `${knot.x - KNOT_SIZE / 2}px`;
          el.style.top = `${knot.y - KNOT_SIZE / 2}px`;
          const labelEl = boardEl.querySelector(`.knot-label[data-knot-label-id="${start.id}"]`);
          if (labelEl) {
            labelEl.style.left = `${knot.x + 12}px`;
            labelEl.style.top = `${knot.y - 18}px`;
          }
        });
        syncBoardSize(currentLayout);
        scheduleLightweightLinkDraw(currentLayout);
      }
      if (interaction.type === "zone-resize") {
        event.preventDefault();
        const zone = getLayoutZone(interaction.zoneId);
        const zoneEl = boardEl.querySelector(`.zone[data-zone-id="${interaction.zoneId}"]`);
        if (!zone || !zoneEl) return;
        const dx = (event.clientX - interaction.startX) / viewport.scale;
        const dy = (event.clientY - interaction.startY) / viewport.scale;
        if (Math.abs(dx) > 3 || Math.abs(dy) > 3) interaction.moved = true;
        ensureInteractionHistory();
        if (interaction.direction.includes("e")) {
          zone.width = snap(clamp(interaction.zoneWidth + dx, 260, 2400));
          zoneEl.style.width = `${zone.width}px`;
        }
        if (interaction.direction.includes("s")) {
          zone.height = snap(clamp(interaction.zoneHeight + dy, 180, 1800));
            zoneEl.style.height = `${zone.height}px`;
        }
        saveZoneToScenario(zone);
        syncBoardSize(currentLayout);
      }
      if (["connector", "new-connector", "knot-connector"].includes(interaction.type)) {
        event.preventDefault();
        interaction.moved = true;
        updateConnectorDraft(interaction.draftStart, clientToBoardPoint(event.clientX, event.clientY));
        updateConnectorDropTarget(event);
      }
    }

    function updateConnectorHandleVisibility(event) {
      const point = clientToBoardPoint(event.clientX, event.clientY);
      const threshold = HANDLE_REVEAL_DISTANCE / viewport.scale;
      boardEl.querySelectorAll(".knot-label").forEach((label) => {
        const knot = getKnot(label.dataset.knotLabelId);
        if (!knot) return;
        const visible = Math.hypot(point.x - knot.x, point.y - knot.y) <= threshold;
        label.classList.toggle("visible", visible);
      });
    }

    function hideConnectorHandles() {
      if (["connector", "new-connector", "knot-connector"].includes(interaction?.type)) return;
      linksEl.querySelectorAll(".link-hover-dot").forEach((dot) => dot.classList.remove("visible"));
      boardEl.querySelectorAll(".knot-label").forEach((label) => {
        label.classList.remove("visible");
      });
    }

    function endPointer(event) {
      if (!interaction || event.pointerId !== interaction.pointerId) return;
      const interactionType = interaction.type;
      let changed = false;
      if (interaction.type === "pan") {
        boardScrollEl.classList.remove("panning");
      }
      if (interaction.type === "zoom") {
        boardScrollEl.classList.remove("zooming");
      }
      if (interaction.type === "node") {
        const node = getNode(interaction.nodeId);
        nodeElements.get(interaction.nodeId)?.classList.remove("dragging");
        clearDropTarget();
        if (node && interaction.moved && interaction.targetId) {
          node.parent = interaction.targetId;
          const knot = getKnot(interaction.targetId);
          notify(knot ? `接続先を${knotDisplayName(knot)}に変更しました` : "紐付けを更新しました");
          changed = true;
        }
        if (node && interaction.moved && !interaction.targetId) {
          notify("位置を更新しました");
          changed = true;
        }
      }
      if (interaction.type === "knot") {
        knotElements.get(interaction.knotId)?.classList.remove("dragging");
        if (interaction.moved) {
          notify("線ノットを移動しました");
          changed = true;
        }
      }
      if (interaction.type === "zone") {
        boardEl.querySelector(`.zone[data-zone-id="${interaction.zoneId}"]`)?.classList.remove("dragging");
        if (interaction.moved) {
          notify("枠を移動しました");
          changed = true;
        }
      }
      if (interaction.type === "zone-resize") {
        boardEl.querySelector(`.zone[data-zone-id="${interaction.zoneId}"]`)?.classList.remove("dragging");
        if (interaction.moved) {
          notify("枠のサイズを変更しました");
          changed = true;
        }
      }
      if (["connector", "new-connector", "knot-connector"].includes(interaction.type)) {
        linksEl.querySelectorAll(".link-hit.dragging,.link-hover-dot.dragging").forEach((el) => el.classList.remove("dragging"));
        clearDropTarget();
        if (interaction.targetId || interaction.targetKnotId) {
          changed = interaction.type === "new-connector"
            ? applyNewConnector(interaction)
            : (interaction.type === "knot-connector" ? applyKnotConnectorRewire(interaction) : applyConnectorRewire(interaction));
        }
        linksEl.querySelectorAll(".link-hover-dot").forEach((dot) => dot.classList.remove("visible"));
      }
      try {
        boardScrollEl.releasePointerCapture(event.pointerId);
      } catch (error) {
        // Pointer capture may already be released by the browser.
      }
      interaction = null;
      cancelScheduledLinkDraw();
      clearConnectorDraft();
      if (!changed || interactionType === "pan" || interactionType === "zoom") return;
      saveState();
      render();
    }

    function updateConnectorDropTarget(event) {
      const hoverEl = document.elementFromPoint(event.clientX, event.clientY);
      const targetKnotEl = hoverEl?.closest(".knot");
      const targetEl = targetKnotEl ? null : hoverEl?.closest(".node");
      const targetId = targetEl?.dataset.nodeId;
      const hoverKnotId = targetKnotEl?.dataset.knotId || null;
      let validKnot = null;
      if (hoverKnotId) {
        if (interaction.type === "new-connector" || interaction.endpoint === "source") {
          validKnot = hoverKnotId !== interaction.nodeId && !isDescendant(hoverKnotId, interaction.nodeId) ? hoverKnotId : null;
        } else {
          validKnot = hoverKnotId !== interaction.parentId && !isDescendant(interaction.parentId, hoverKnotId) ? hoverKnotId : null;
        }
      }
      let validTarget = null;
      if (targetId) {
        if (interaction.type === "new-connector" || interaction.endpoint === "source") {
          validTarget = targetId !== interaction.nodeId && !isDescendant(targetId, interaction.nodeId) ? targetId : null;
        } else {
          validTarget = targetId !== interaction.parentId && !isDescendant(interaction.parentId, targetId) ? targetId : null;
        }
      }
      if (validTarget === interaction.targetId && validKnot === interaction.targetKnotId) return;
      clearDropTarget();
      interaction.targetId = validTarget;
      interaction.targetKnotId = validKnot;
      if (validTarget) nodeElements.get(validTarget)?.classList.add("drop-target");
      if (validKnot) knotElements.get(validKnot)?.classList.add("drop-target");
    }

    function applyConnectorRewire(connector) {
      const scenario = getActiveScenario();
      const child = scenario.nodes.find((node) => node.id === connector.nodeId);
      if (!child) return false;
      if (connector.endpoint === "source") {
        const nextParentId = connector.targetKnotId || connector.targetId;
        if (!nextParentId || nextParentId === child.id || child.parent === nextParentId) return false;
        pushHistory();
        updateLockedLinkIds(connector.linkId, `${nextParentId}->${connector.nodeId}`);
        child.parent = nextParentId;
        notify("親側の接続先を変更しました");
        return true;
      }
      const newChild = connector.targetKnotId
        ? getKnot(connector.targetKnotId)
        : scenario.nodes.find((node) => node.id === connector.targetId);
      if (!newChild || newChild.id === child.id) return false;
      pushHistory();
      updateLockedLinkIds(connector.linkId, `${connector.parentId}->${newChild.id}`);
      child.parent = null;
      newChild.parent = connector.parentId;
      selectedNodeId = connector.targetKnotId ? null : newChild.id;
      selectedKnotId = connector.targetKnotId ? newChild.id : null;
      notify("子側の接続先を変更しました");
      return true;
    }

    function applyKnotConnectorRewire(connector) {
      const knot = getKnot(connector.knotId);
      if (!knot || knot.locked) return false;
      if (connector.endpoint === "source") {
        const nextParentId = connector.targetKnotId || connector.targetId;
        if (!nextParentId || nextParentId === knot.id || nextParentId === knot.parent) return false;
        if (isDescendant(nextParentId, knot.id)) return false;
        pushHistory();
        updateLockedLinkIds(connector.linkId, `${nextParentId}->${knot.id}`);
        knot.parent = nextParentId;
        selectedNodeId = null;
        selectedKnotId = knot.id;
        notify("ノットの親側接続を変更しました");
        return true;
      }
      const nextChild = connector.targetKnotId ? getKnot(connector.targetKnotId) : getNode(connector.targetId);
      if (!nextChild || nextChild.id === knot.id || nextChild.id === connector.parentId) return false;
      if (isDescendant(connector.parentId, nextChild.id)) return false;
      pushHistory();
      updateLockedLinkIds(connector.linkId, `${connector.parentId}->${nextChild.id}`);
      knot.parent = null;
      nextChild.parent = connector.parentId;
      selectedNodeId = connector.targetKnotId ? null : nextChild.id;
      selectedKnotId = connector.targetKnotId ? nextChild.id : null;
      notify("ノット線の子側接続先を変更しました");
      return true;
    }

    function applyNewConnector(connector) {
      const child = getNode(connector.nodeId);
      const nextParentId = connector.targetKnotId || connector.targetId;
      if (!child || !nextParentId || child.parent === nextParentId) return false;
      pushHistory();
      updateLockedLinkIds(`${child.parent}->${child.id}`, `${nextParentId}->${child.id}`);
      child.parent = nextParentId;
      const knot = getKnot(nextParentId);
      notify(knot ? `接続先を${knotDisplayName(knot)}に設定しました` : "接続先を設定しました");
      return true;
    }

    function updateLockedLinkIds(oldId, newId) {
      getCurrentKnots().forEach((knot) => {
        if (!knot.lockedLinks?.includes(oldId)) return;
        knot.lockedLinks = knot.lockedLinks.map((id) => id === oldId ? newId : id);
      });
    }

    function updateDropTarget(event) {
      const draggedEl = nodeElements.get(interaction.nodeId);
      if (draggedEl) draggedEl.style.pointerEvents = "none";
      const hoverEl = document.elementFromPoint(event.clientX, event.clientY);
      const targetKnotEl = hoverEl?.closest(".knot");
      const targetEl = targetKnotEl ? null : hoverEl?.closest(".node");
      if (draggedEl) draggedEl.style.pointerEvents = "";
      const targetId = targetEl?.dataset.nodeId;
      const knotTargetId = targetKnotEl?.dataset.knotId || null;
      const validTarget = (knotTargetId && !isDescendant(knotTargetId, interaction.nodeId))
        ? knotTargetId
        : (targetId && targetId !== interaction.nodeId && !isDescendant(targetId, interaction.nodeId) ? targetId : null);
      if (validTarget === interaction.targetId) return;
      clearDropTarget();
      interaction.targetId = validTarget;
      if (knotTargetId) {
        knotElements.get(knotTargetId)?.classList.add("drop-target");
      } else if (validTarget) {
        nodeElements.get(validTarget)?.classList.add("drop-target");
      }
    }

    function clearDropTarget() {
      nodeElements.forEach((el) => el.classList.remove("drop-target"));
      knotElements.forEach((el) => el.classList.remove("drop-target"));
    }

    function setSelectedNodeClass(nodeId) {
      nodeElements.forEach((el, id) => {
        el.classList.toggle("selected", id === nodeId);
      });
    }

    function setSelectedKnotClass(knotId) {
      knotElements.forEach((el, id) => {
        el.classList.toggle("selected", id === knotId);
      });
    }

    function setSelectedZoneClass(zoneId) {
      boardEl.querySelectorAll(".zone").forEach((el) => {
        el.classList.toggle("selected", el.dataset.zoneId === zoneId);
      });
    }

    function ensureInteractionHistory() {
      if (interaction?.historyDone) return;
      pushHistory();
      interaction.historyDone = true;
    }

    function capturePointer(pointerId) {
      try {
        boardScrollEl.setPointerCapture(pointerId);
      } catch (error) {
        // Some browsers refuse capture for middle-button gestures; movement still works in most cases.
      }
    }

    function zoomByWheel(event) {
      event.preventDefault();
      const nextScale = viewport.scale * Math.exp(-event.deltaY / 620);
      setScale(nextScale, event.clientX, event.clientY);
    }

    function setScale(nextScale, clientX, clientY) {
      const scale = clamp(nextScale, .45, 2.1);
      if (Math.abs(scale - viewport.scale) < .001) return;
      const scrollerRect = boardScrollEl.getBoundingClientRect();
      const boardPoint = clientToBoardPoint(clientX, clientY);
      viewport.scale = scale;
      applyZoom();
      boardScrollEl.scrollLeft = boardPoint.x * viewport.scale - (clientX - scrollerRect.left);
      boardScrollEl.scrollTop = boardPoint.y * viewport.scale - (clientY - scrollerRect.top);
      renderStats();
    }

    function applyZoom() {
      boardEl.style.zoom = viewport.scale;
    }

    function clientToBoardPoint(clientX, clientY) {
      const rect = boardEl.getBoundingClientRect();
      return {
        x: (clientX - rect.left) / viewport.scale,
        y: (clientY - rect.top) / viewport.scale
      };
    }

    function syncBoardSize(layout) {
      if (!layout) return;
      const positioned = [...layout.positions.values()];
      const knots = layout.knots || [];
      const zones = layout.zones || [];
      layout.contentBounds = layoutContentBounds(positioned, knots, zones);
      layout.boardWidth = Math.max(CANVAS.width, 1060, ...positioned.map((pos) => pos.x + pos.width + BOARD_MARGIN.right), ...knots.map((knot) => knot.x + BOARD_MARGIN.right), ...zones.map((zone) => zone.x + zone.width + BOARD_MARGIN.right));
      layout.boardHeight = Math.max(CANVAS.height, 1040, ...positioned.map((pos) => pos.y + pos.height + BOARD_MARGIN.bottom), ...knots.map((knot) => knot.y + BOARD_MARGIN.bottom), ...zones.map((zone) => zone.y + zone.height + BOARD_MARGIN.bottom));
      boardEl.style.width = `${layout.boardWidth}px`;
      boardEl.style.height = `${layout.boardHeight}px`;
      linksEl.setAttribute("width", layout.boardWidth);
      linksEl.setAttribute("height", layout.boardHeight);
      linksEl.setAttribute("viewBox", `0 0 ${layout.boardWidth} ${layout.boardHeight}`);
      applyZoom();
    }

    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }

    function snap(value) {
      return Math.round(Number(value || 0) / GRID) * GRID;
    }

    function applyCardFloatPhase(nodeEl, node) {
      const seed = stableFloatSeed(node.id);
      const duration = 8.4 + (seed % 29) / 10;
      const elapsed = (performance.now() - floatEpoch) / 1000;
      const phase = (elapsed + (seed % 977) / 97) % duration;
      const direction = seed % 2 === 0 ? 1 : -1;
      const sway = 1.1 + ((seed >>> 5) % 12) / 10;
      const lift = 3.8 + ((seed >>> 11) % 15) / 10;
      const tilt = .32 + ((seed >>> 17) % 32) / 100;
      const px = (value) => `${value.toFixed(2)}px`;
      const deg = (value) => `${value.toFixed(2)}deg`;

      nodeEl.style.setProperty("--float-duration", `${duration.toFixed(2)}s`);
      nodeEl.style.setProperty("--float-delay", `-${phase.toFixed(2)}s`);
      nodeEl.style.setProperty("--float-x-start", px(-direction * sway * .38));
      nodeEl.style.setProperty("--float-y-start", px(1.1 + (seed % 6) / 10));
      nodeEl.style.setProperty("--float-r-start", deg(-direction * tilt * .7));
      nodeEl.style.setProperty("--float-x-peak", px(direction * sway));
      nodeEl.style.setProperty("--float-y-peak", px(-lift));
      nodeEl.style.setProperty("--float-r-peak", deg(direction * tilt));
      nodeEl.style.setProperty("--float-x-return", px(-direction * sway * .76));
      nodeEl.style.setProperty("--float-y-return", px(-lift * .28));
      nodeEl.style.setProperty("--float-r-return", deg(-direction * tilt * .88));
    }

    function stableFloatSeed(value) {
      return Array.from(`${value || "node"}`).reduce(
        (hash, char) => Math.imul(hash ^ char.codePointAt(0), 16777619) >>> 0,
        2166136261
      );
    }

    function fitPersonName(nodeEl) {
      const nameEl = nodeEl.querySelector(".person");
      if (!nameEl || !nameEl.textContent.trim()) return;
      const baseSize = 20;
      const minimumSize = 10;
      nameEl.style.fontSize = `${baseSize}px`;
      const availableWidth = nameEl.clientWidth;
      const textWidth = nameEl.scrollWidth;
      if (!availableWidth || textWidth <= availableWidth) return;
      const fittedSize = clamp(
        Math.floor((baseSize * availableWidth / textWidth) * 10) / 10,
        minimumSize,
        baseSize
      );
      nameEl.style.fontSize = `${fittedSize}px`;
    }

    function buildNodeClass(node, nodeMap) {
      const classes = ["node", node.lane || "core", node.status || "current"];
      if (node.colorOverride) classes.push("manual-color", `palette-${node.colorOverride}`);
      if (node.borderStyleOverride) classes.push("manual-border", `border-${node.borderStyleOverride}`);
      classes.push("has-avatar");
      if (node.id === selectedNodeId) classes.push("selected");
      if (node.id === actionPulseNodeId) classes.push("action-pulse");
      if (node.status === "risk" || (node.parent && nodeMap.get(node.parent)?.status === "removed")) classes.push("risk");
      if (searchTerm && !`${node.name} ${node.role} ${node.team} ${node.decision} ${node.requirement}`.toLowerCase().includes(searchTerm)) classes.push("hidden-by-filter");
      return classes.join(" ");
    }

    function diffLabel(node) {
      if (activeScenarioId === "current") return "";
      const base = baseMap().get(node.id);
      if (!base) return "追加";
      if (node.status === "removed") return "減";
      const keys = ["name", "role", "team", "parent", "lane", "decision", "requirement", "hiring", "colorOverride", "borderStyleOverride"];
      return keys.some((key) => `${node[key] || ""}` !== `${base[key] || ""}`) || node.status !== base.status ? "変更" : "";
    }

    function renderStats() {

              <label for="cardColorOverride">カード色</label>

                ${option("", "自動", node.colorOverride || "")}
                ${option("core", "中核", node.colorOverride || "")}
                ${option("external", "C&Rライン", node.colorOverride || "")}
                ${option("added", "追加", node.colorOverride || "")}
                ${option("candidate", "候補", node.colorOverride || "")}
                ${option("hiring", "採用枠", node.colorOverride || "")}

              </select>
            </div>
            <div class="field">
              <label for="borderStyleOverride">枠線</label>
              <select id="borderStyleOverride">
                ${option("", "自動", node.borderStyleOverride || "")}

      bindInspectorField("personName", "input", (value) => ({ name: value }));
      bindInspectorField("roleName", "input", (value) => ({ role: value }));
      bindInspectorField("teamName", "input", (value) => ({ team: value }));
      bindInspectorField("laneName", "change", (value) => ({ lane: value }));
      bindInspectorField("parentNode", "change", (value) => ({ parent: value || null }));
      bindInspectorField("statusName", "change", (value) => ({ status: value, hiring: value === "hiring" }));
      bindInspectorField("cardColorOverride", "change", (value) => ({ colorOverride: value || null }));
      bindInspectorField("borderStyleOverride", "change", (value) => ({ borderStyleOverride: value || null }));
      bindInspectorField("decisionName", "input", (value) => ({ decision: value }));
      bindInspectorField("noteName", "input", (value) => ({ note: value }));
      bindInspectorField("requirementName", "input", (value) => ({ requirement: value }));
      document.getElementById("vacancyPanelBtn").addEventListener("click", makeVacancy);
      document.getElementById("removePanelBtn").addEventListener("click", markRemoved);
