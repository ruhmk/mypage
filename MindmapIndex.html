<!doctype html>
<html lang="ja" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Knowledge Map Canvas</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <aside class="sidebar" aria-label="Mind map controls">
        <header class="brand">
          <div>
            <p class="eyebrow">Local mind map</p>
            <h1>Knowledge Map Canvas</h1>
          </div>
          <button class="icon-button" id="themeToggle" type="button" title="テーマ切替">◐</button>
        </header>

        <section class="panel">
          <div class="panel-heading">
            <h2>入力</h2>
            <button id="sampleButton" type="button">サンプル</button>
          </div>
          <textarea id="outlineInput" spellcheck="false" aria-label="Outline input"></textarea>
          <div class="button-row">
            <button id="importButton" type="button">反映</button>
          </div>
        </section>

        <section class="panel">
          <h2>マップ</h2>
          <label class="field">
            <span>保存済み</span>
            <select id="mapSelect" aria-label="保存済みマップ"></select>
          </label>
          <div class="button-row">
            <button id="newMapButton" type="button">新規</button>
            <button id="saveMapButton" type="button">保存</button>
          </div>
          <div class="button-row">
            <button id="openMarkdownButton" type="button">MDを開く</button>
            <button id="saveMarkdownButton" type="button">MD保存</button>
          </div>
          <input id="markdownFileInput" type="file" accept=".md,.markdown,text/markdown,text/plain" hidden />
        </section>

        <section class="panel">
          <h2>ノード詳細</h2>
          <p class="selected-node-name" id="nodeDetailTitle">未選択</p>
          <div class="button-row">
            <button id="focusNodeButton" type="button">フォーカス</button>
            <button id="jumpSourceButton" type="button">元へ</button>
          </div>
          <label class="field">
            <span>種類</span>
            <select id="nodeTypeSelect" aria-label="ノード種別">
              <option value="idea">要点</option>
              <option value="task">タスク</option>
              <option value="decision">決定</option>
              <option value="risk">注意</option>
              <option value="question">問い</option>
            </select>
          </label>
          <label class="field">
            <span>関係線</span>
            <select id="relationTypeSelect" aria-label="関係線タイプ">
              <option value="normal">通常</option>
              <option value="note">補足</option>
              <option value="dependency">依存</option>
              <option value="risk">注意</option>
            </select>
          </label>
          <textarea id="nodeNoteInput" placeholder="このノードのメモ" aria-label="Node memo"></textarea>
        </section>

        <section class="panel">
          <div class="panel-heading">
            <h2>階層</h2>
            <button id="showAllLayersButton" type="button">全階層</button>
          </div>
          <div id="layerList" class="layer-list" aria-label="階層一覧"></div>
        </section>

        <section class="panel">
          <h2>表示</h2>
          <label class="field">
            <span>検索</span>
            <input id="searchInput" type="search" placeholder="キーワード" />
          </label>
          <label class="field">
            <span>表示の細かさ</span>
            <input id="depthSlider" type="range" min="1" max="8" value="8" />
          </label>
          <label class="field">
            <span>横の距離</span>
            <input id="horizontalSpacingSlider" type="range" min="180" max="520" value="452" />
          </label>
          <label class="field">
            <span>縦の距離</span>
            <input id="verticalSpacingSlider" type="range" min="16" max="120" value="26" />
          </label>
          <label class="field">
            <span class="field-heading">
              <span>スナップ幅</span>
              <output id="snapStepValue" class="field-value">32px</output>
            </span>
            <input id="snapStepSlider" type="range" min="8" max="96" step="4" value="32" />
          </label>
          <div class="button-row">
            <button id="optimizeLayoutButton" type="button" title="手動位置を初期化して自動整列">自動整列</button>
            <button id="fitButton" type="button" title="全体表示">全体表示</button>
          </div>
        </section>

        <section class="panel">
          <h2>出力</h2>
          <div class="button-row">
            <button id="exportJsonButton" type="button">JSON</button>
            <button id="exportMarkdownButton" type="button">Markdown</button>
            <button id="savePngButton" type="button">PNG保存</button>
          </div>
          <textarea id="exportOutput" readonly aria-label="Export output"></textarea>
        </section>

        <section class="panel">
          <button id="summaryButton" type="button">要約</button>
          <textarea id="summaryOutput" readonly aria-label="Summary output"></textarea>
        </section>
      </aside>

      <section class="workspace" aria-label="Mind map workspace">
        <div class="workspace-bar">
          <div>
            <p id="statusText">ノードをクリックして選択、文字はその場で編集できます。</p>
            <strong id="selectionLabel">未選択</strong>
          </div>
          <div class="zoom-controls" aria-label="Zoom controls">
            <button id="view3dButton" type="button" title="階層を3D表示">3D</button>
            <button id="clearLayerButton" type="button" title="通常の2D表示へ戻る" hidden>通常2D</button>
            <button id="maximizeMapButton" type="button" title="マップを最大化">最大化</button>
            <button id="zoomOutButton" type="button" title="縮小">−</button>
            <button id="zoomResetButton" type="button" title="100%">100%</button>
            <button id="zoomInButton" type="button" title="拡大">＋</button>
          </div>
        </div>

        <div id="canvasViewport" class="canvas-viewport">
          <div id="layer3dControls" class="layer-3d-controls" hidden>
            <button id="layerUpButton" type="button">上</button>
            <strong id="layerLevelLabel">階層 0</strong>
            <button id="layerDownButton" type="button">下</button>
            <button id="addLowerLayerButton" type="button">下層に追加</button>
            <button id="commitLayerButton" type="button">階層決定</button>
            <button id="exit3dButton" type="button">2Dへ戻る</button>
          </div>
          <button id="restoreMapButton" class="restore-map-button" type="button" hidden>戻す</button>
          <div id="canvasWorld" class="canvas-world">
            <svg id="floorLayer" class="floor-layer" aria-hidden="true"></svg>
            <svg id="edgeLayer" class="edge-layer" aria-hidden="true"></svg>
            <div id="guideLayer" class="guide-layer" aria-hidden="true">
              <span id="guideVertical" class="alignment-guide vertical"></span>
              <span id="guideHorizontal" class="alignment-guide horizontal"></span>
            </div>
            <div id="nodeLayer" class="node-layer"></div>
          </div>
        </div>
      </section>
    </main>

    <div id="nodeContextMenu" class="context-menu" hidden></div>

    <script src="./app.js"></script>
  </body>
</html>
